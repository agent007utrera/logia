<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vestíbulo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">

<style>
:root {
    --negro:        #040806;
    --bosque:       #0a1510;
    --musgo:        #12261b;
    --esmeralda:    #2f7d57;
    --verdin:       #5fb98a;
    --brillo:       #9bf0c0;
    --laton:        #b49a55;
    --laton-osc:    #6e5c2e;
    --pergamino:    #d9d3b3;
    --pergamino-osc:#a9a285;
    --sangre:       #a8423a;
    --fuente-titulo: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    --fuente-sub:    'Cinzel', Georgia, serif;
    --fuente-cuerpo: 'IM Fell English', Georgia, 'Times New Roman', serif;
    --fuente-maquina:'Special Elite', 'Courier New', monospace;

    --ratio-w: 16;
    --ratio-h: 9;
}

body, html {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background-color: var(--negro);
    background-image: radial-gradient(circle at 50% 40%, #0f2318 0%, #050a07 75%);
    font-family: var(--fuente-cuerpo);
    color: var(--pergamino);
}
* { box-sizing: border-box; }

body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 4999;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
}
body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5000;
    opacity: 0.09;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.layout-container {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 8px;
    padding: 8px;
    width: 100%;
    height: 100%;
}

.room-section {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-color: #000;
    border: 2px solid var(--laton-osc);
    box-shadow: inset 0 0 0 3px #000, inset 0 0 0 4px var(--laton-osc), 0 0 30px rgba(47,125,87,0.18);
    border-radius: 3px;
    overflow: hidden;
}

.game-container {
    position: relative;
    width: min(100%, calc((100vh - 28px) * var(--ratio-w) / var(--ratio-h)));
    aspect-ratio: var(--ratio-w) / var(--ratio-h);
    background: linear-gradient(135deg, #0c1a13 0%, #07110c 60%, #0c1a13 100%);
}
.game-image {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    object-fit: cover;
}

.hotspot {
    position: absolute;
    background-color: transparent;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s, box-shadow 0.3s;
}
.hotspot:hover {
    background-color: rgba(95, 185, 138, 0.38);
    box-shadow: inset 0 0 22px rgba(155, 240, 192, 0.85);
}

#hsLampara { top: 6.8%; left: 8.2%; width: 12.4%; height: 35.7%; clip-path: polygon(42.6% 0.0%, 98.8% 0.0%, 100.0% 100.0%, 0.0% 100.0%, 0.0% 46.7%, 42.6% 46.7%); }
#hsPuerta { top: 10.3%; left: 56.0%; width: 11.3%; height: 77.2%; clip-path: polygon(0% 88%, 2% 9%, 100% 0%, 90% 100%); }
#hsSombreros { top: 9.1%; left: 66.4%; width: 31.3%; height: 20.2%; clip-path: polygon(0.0% 38.7%, 19.2% 37.4%, 28.6% 31.0%, 63.7% 18.1%, 75.4% 0.0%, 99.3% 1.3%, 100.0% 77.4%, 84.8% 89.0%, 67.2% 93.5%, 19.2% 100.0%, 0.5% 98.1%); }
#hsAbrigo { top: 26.7%; left: 66.0%; width: 10.7%; height: 52.7%; clip-path: polygon(2.1% 3.7%, 60.3% 0.0%, 95.9% 13.6%, 100.0% 65.4%, 91.1% 97.5%, 5.5% 100.0%, 0.0% 53.1%); }
#hsEmblemas { top: 16.7%; left: 45.8%; width: 7.8%; height: 26.3%; clip-path: polygon(0.0% 3.0%, 98.1% 0.0%, 100.0% 100.0%, 1.9% 100.0%); }
#hsParaguas { top: 50.5%; left: 47.4%; width: 4.5%; height: 26.3%; clip-path: polygon(6.5% 2.0%, 71.0% 0.0%, 100.0% 35.6%, 96.8% 65.3%, 87.1% 97.5%, 3.2% 100.0%, 0.0% 55.4%); }
#hsEscalera { top: 5.5%; left: 24.2%; width: 18.8%; height: 62.2%; clip-path: polygon(0.0% 100.0%, 0.8% 22.6%, 18.8% 5.9%, 50.0% 0.0%, 81.2% 3.8%, 100.0% 14.2%, 100.0% 100.0%, 65.6% 96.9%); }

#hsLibro {
    top: 68%;
    left: 71%;
    width: 18%;
    height: 10%;
    clip-path: polygon(0% 38%, 70% 100%, 100% 69%, 64% 18%, 56% 0%, 31% 0%);
}

#hsAlfombra {
    top: 66%;
    left: 25%;
    width: 32%;
    height: 34%;
    clip-path: polygon(0% 6%, 37% 0%, 100% 100%, 17% 100%);
}

#hsCajon {
    top: 74%;
    left: 73%;
    width: 10%;
    height: 12%;
    clip-path: polygon(0% 52%, 100% 100%, 100% 43%, 1% 0%);
}



.player-hud {
    position: fixed; top: 15px; right: 20px;
    background: rgba(5, 12, 8, 0.94);
    border: 1px solid var(--laton);
    outline: 1px solid var(--laton-osc); outline-offset: 2px;
    color: var(--verdin); padding: 8px 16px;
    font-family: var(--fuente-maquina); font-size: 0.9rem;
    letter-spacing: 2px; z-index: 1500;
    box-shadow: 0 0 14px rgba(47, 125, 87, 0.45); text-align: center;
}

#timerContainer {
    position: fixed; top: 15px; left: 15px;
    background: linear-gradient(135deg, #0a1510 0%, #12261b 100%);
    color: var(--brillo); border: 1px solid var(--laton);
    outline: 1px solid var(--laton-osc); outline-offset: 2px;
    box-shadow: inset 0 0 10px rgba(95,185,138,0.2), 0 0 12px rgba(47,125,87,0.35);
    padding: 8px 14px; font-family: var(--fuente-maquina);
    font-size: 0.95rem; letter-spacing: 2px; z-index: 1500;
}

.back-btn {
    display: none; position: fixed; top: 15px; left: 15px;
    background: var(--musgo); color: var(--brillo);
    border: 1px solid var(--laton); outline: 1px solid var(--laton-osc); outline-offset: 2px;
    padding: 8px 14px; font-family: var(--fuente-sub); font-size: 0.8rem;
    letter-spacing: 2px; text-decoration: none; z-index: 1500;
}

.video-sidebar {
    background: rgba(4, 9, 6, 0.96);
    border: 2px solid var(--laton-osc);
    box-shadow: inset 0 0 0 3px #000, inset 0 0 0 4px var(--laton-osc), 0 0 15px rgba(0,0,0,0.8);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: var(--fuente-maquina); border-radius: 3px;
}
.video-header {
    padding: 12px 10px; background: linear-gradient(180deg, #0f2318, #08120d);
    border-bottom: 1px solid var(--laton-osc); color: var(--laton);
    font-family: var(--fuente-sub); font-size: 0.85rem; text-align: center; letter-spacing: 3px;
}

#video-grid {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Crea exactamente 2 columnas iguales */
    gap: 8px;                              /* Espacio de separación entre las webcams */
    align-content: start;                  /* Alinea las filas hacia arriba ordenadamente */
}

.video-card {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3; /* Mantiene la proporción clásica de cámara */
    background: #000;
    border: 1px solid #1a3a5c;
    border-radius: 4px;
    overflow: hidden;
}

.video-card video { width: 100%; height: 100%; object-fit: cover; }
.video-name {
    position: absolute;
    left: 5px; bottom: 5px;
    max-width: calc(100% - 10px);
    padding: 2px 7px;
    background: rgba(4, 9, 6, 0.88);
    color: var(--brillo);
    font-size: 0.68rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid rgba(180, 154, 85, 0.5);
}
.aforo-aviso {
    color: var(--laton); font-family: var(--fuente-sub); font-size: 0.72rem; letter-spacing: 3px;
    text-align: center; margin: 0; padding: 6px; border-top: 1px solid var(--laton-osc);
    background: #060d09; display: flex; align-items: center; justify-content: space-between;
}
.aforo-aviso button { background: var(--musgo); border: 1px solid var(--laton-osc); color: var(--brillo); padding: 2px 8px; cursor: pointer; }
.aforo-aviso button { position: relative; overflow: hidden; }
.aforo-aviso button.off { background: #2a0e0b; border-color: var(--sangre); color: var(--sangre); }
.aforo-aviso button.off::after {   /* tachón diagonal cuando está apagado */
    content: ""; position: absolute; top: 50%; left: -20%;
    width: 140%; height: 2px; background: var(--sangre);
    transform: translateY(-50%) rotate(-45deg); pointer-events: none;
}

.modal {
    display: none; position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(6,16,10,0.82), rgba(0,0,0,0.92));
    backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center;
}
.modal-content {
    position: relative; width: 90%; max-width: 470px; max-height: 82vh; overflow-y: auto;
    padding: 30px; background: linear-gradient(180deg, #14291d 0%, #0b1710 100%);
    border: 2px solid var(--laton); box-shadow: 0 0 0 4px #000, 0 0 0 5px var(--laton-osc), 0 10px 40px rgba(0,0,0,0.9);
}
.modal-content h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 1.3rem; text-align: center; color: var(--verdin); }
.modal-content p { line-height: 1.65; color: var(--pergamino); text-align: center; }
.close-btn { position: absolute; top: 12px; right: 18px; font-size: 1.7rem; color: var(--laton); background: none; border: none; cursor: pointer; }

.drawer-img { display: block; margin: 14px auto 6px; width: 70%; max-height: 180px; object-fit: contain; border: 1px solid var(--laton); cursor: zoom-in; }
.fila-botones { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
.drawer-btn { background: #1c3d2b; color: var(--brillo); border: 1px solid var(--laton); padding: 9px 20px; font-family: var(--fuente-sub); cursor: pointer; }
.drawer-btn.no { background: #3a1613; border-color: var(--sangre); color: #e9a29b; }
.cost-box { margin: 14px 0 4px; padding: 9px; border: 1px dashed var(--laton-osc); background: rgba(47,125,87,0.1); text-align: center; color: var(--brillo); font-family: var(--fuente-maquina); }

#fullscreenViewer { display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.96); z-index: 3000; justify-content: center; align-items: center; }
#fullscreenViewer img { max-width: 92%; max-height: 92%; object-fit: contain; border: 1px solid var(--laton-osc); }
</style>
</head>

<body>

<div class="player-hud" id="playerHud">
    <div id="identidadTexto">IDENTIDAD: CARGANDO...</div>
    <div id="video-status-hud" style="font-size:0.7rem;color:var(--pergamino-osc);margin-top:4px;letter-spacing:1px;">Conectando...</div>
</div>

<div id="timerContainer">PUERTA CERRADA: <span id="countdown">00:10</span></div>
<a href="#" id="backBtn" class="back-btn" onclick="playClick(); volverAlMapa(event)">IR AL PASILLO</a>

<div class="layout-container">
    <div class="room-section">
    <div class="game-container" id="gameContainer">
        <video src="images/sala_vestibulo.mp4" class="game-image" autoplay muted loop playsinline preload="auto" aria-label="Vestíbulo de la Logia"></video>

        <!-- HOTSPOTS (los marcados como OBJETO RECOGIBLE dan un objeto; el resto solo describen) -->
        <!-- Lámpara de aceite -->
        <div class="hotspot" id="hsLampara" data-etiqueta="Lámpara de aceite" onclick="playClick(); abrirInfo('La lámpara de aceite', 'La llama no vacila. Es lo primero que advertís y lo que más os inquieta: por el vestíbulo corre un hálito húmedo, venido de algún lugar muy por debajo de los cimientos, y sin embargo la mecha arde recta, inmóvil, como sostenida por una mano que no se deja ver. El latón, de un pulido antinatural, devuelve vuestro reflejo ensanchado y deforme, y por un instante os parece distinguir, detrás de vuestro hombro, un rostro que sonríe con demasiados dientes.')"></div>

        <!-- Puerta de la Logia -->
        <div class="hotspot" id="hsPuerta" data-etiqueta="Puerta de la Logia" onclick="playClick(); irAlSalon(event)"></div>

        <!-- Sombreros -->
        <div class="hotspot" id="hsSombreros" data-etiqueta="Sombreros" onclick="playClick(); abrirInfo('Los sombreros', 'Cuatro tocados cuelgan de sus clavijas, quietos, como cabezas cercenadas por un verdugo cortés. Ninguno lleva nombre ni iniciales. El fieltro conserva aún la forma de cráneos que no recordáis haber visto entrar, y de la gorra de tweed emana un tenue olor a salitre y a algas podridas, un olor del todo imposible en Arkham, a tantas leguas de la costa.')"></div>

        <!-- Abrigo negro · OBJETO RECOGIBLE: Nota anónima (Prueba D) -->
        <div class="hotspot" id="hsAbrigo" data-etiqueta="Abrigo negro" onclick="playClick(); accionRecoger('prueba_d_nota')"></div>

        <!-- Libro de visitas -->
        <div class="hotspot" id="hsLibro" data-etiqueta="Libro de visitas" onclick="playClick(); abrirInfo('El libro de visitas', 'Abierto sobre el pupitre, bajo el cabo de vela, parece esperaros. Las firmas se suceden en caligrafías pulcras, correctas, victorianas; pero hacia el final la letra degenera en garabatos temblorosos, y en la última línea ya no son letras sino signos que no pertenecen a alfabeto alguno de la Tierra. La pluma reposa en el tintero con la punta aún húmeda, y tenéis la certeza, sin saber por qué, de que alguien acaba de escribir aquí.')"></div>

        <!-- Emblemas y placa -->
        <div class="hotspot" id="hsEmblemas" data-etiqueta="Emblemas y placa" onclick="playClick(); abrirInfo('Emblemas y placa', 'Escuadras, compases y un ojo dentro de un triángulo, enmarcados con devoción casi religiosa. Bajo ellos, una pequeña placa de esmalte ruega <b>silencio</b>, y de pronto comprendéis que no es una cortesía, sino una advertencia. Cuanto más miráis los grabados, más os convencéis de que las figuras no están donde estaban: se han ido desplazando, un grado cada noche, y los compases parecen cerrarse lentamente sobre algo que no está en el cuadro.')"></div>

        <!-- Paragüero · OBJETO RECOGIBLE: Munición para revólver -->
        <div class="hotspot" id="hsParaguas" data-etiqueta="Paragüero" onclick="playClick(); accionRecoger('municion_revolver1')"></div>

        <!-- Arco y escalera · OBJETO RECOGIBLE: Frasco de kola -->
        <div class="hotspot" id="hsEscalera" data-etiqueta="Arco y escalera" onclick="playClick(); accionRecoger('kola')"></div>

        <!-- Alfombra del pasillo -->
        <div class="hotspot" id="hsAlfombra" data-etiqueta="Alfombra del pasillo" onclick="playClick(); abrirInfo('La alfombra', 'Una alfombra persa, raída por incontables pasos, de dibujo laberíntico. Al seguir con la mirada las volutas os percatáis de que no se repiten: parecen tejer, de umbral a umbral, una espiral que desciende y que os atrae el estómago como un vértigo. Las tablas crujen bajo vuestros pies con un sonido largo y húmedo, y durante un instante el suelo entero se hincha y se deshincha, como si la casa respirase.')"></div>
 
        <div class="hotspot" id="hsCajon" data-etiqueta="Cajón cerrado" onclick="playClick(); accionCajon()"></div>




   </div>
    </div>

    <aside class="video-sidebar">
        <div class="video-header"><span id="video-status">Conectando...</span></div>
        <div id="video-grid"></div>
        <p class="aforo-aviso">
            <button id="btnMic" onclick="toggleMicrofono()">🎤</button>
            VESTÍBULO
            <button id="btnCam" onclick="toggleCamara()">📷</button>
        </p>
    </aside>
</div>

<div id="gameModal" class="modal">
    <div class="modal-content" id="modalContent">
        <button class="close-btn" onclick="playClick(); closeModal()">&times;</button>
        <h3 id="modalTitle">Título</h3>
        <div id="modalBody"><p id="modalText">Texto...</p></div>
    </div>
</div>

<div id="fullscreenViewer" onclick="playClick(); closeFullscreen()">
    <img id="fullscreenImg" src="" alt="Pantalla completa" style="display:none;">
</div>

<script>
// Nombre de ESTA sala dentro de "localizaciones" en Firebase.
// Tiene que coincidir con el que pongas en MAPA_SALA_OBJETOS de master_objetos.html.
const SALA_ID = "sala_vestibulo";

const NOMBRES_JUGADORES = {
    jugador1278: "WETHERBY",
    jugador2935: "BREWER",
    jugador3194: "CRANE",
    jugador4781: "NICHOLS",
    jugador5261: "PICKMAN",
    jugador6193: "RICE"
};

const OBJETOS = {
    kola: {
        item: "kola",
        titulo: "Frasco de kola",
        nombre: "Frasco de kola",
        imagen: "images/kola.jpg",
        descripcion: "Al pie de la escalera, medio oculto en la penumbra del arco, descansa un frasco de cristal etiquetado bajo una fórmula farmacéutica de Arkham, de líquido espeso.",
        // Puntos de Acción que paga CADA jugador ("denegado" = no puede cogerlo)
        costes: {
            jugador1278: 1,           // WETHERBY
            jugador2935: 1,           // BREWER
            jugador3194: 1,           // CRANE
            jugador4781: 1,           // NICHOLS
            jugador5261: 1,           // PICKMAN
            jugador6193: 1            // RICE
        },
        // Descripción normal del hotspot: se ve si ya se han llevado el objeto o si el jugador está denegado
        info: {
            titulo: "El arco y la escalera",
            texto: "Más allá del arco de piedra, una escalera asciende hacia una penumbra que no se corresponde con la arquitectura de la casa. La vidriera de rombos plomizos deja pasar un resplandor lívido, ceniciento, que no es el de ningún sol conocido. Contáis los peldaños que alcanzáis a ver, y al volver a contarlos son más. Del piso de arriba desciende, tenue y dulzón, el aroma de las flores de un funeral."
        },
        textoExito: "Has cogido el frasco de kola y lo guardas en tu inventario."
    },

    prueba_d_nota: {
        item: "prueba_d_nota",
        titulo: "Nota anónima",
        nombre: "Nota anónima",
        imagen: "images/prueba_d_nota.jpg",
        descripcion: "En uno de los bolsillos hinchados del abrigo negro, los dedos tropiezan con un papel doblado: una nota anónima escrita a mano.",
        // Puntos de Acción que paga CADA jugador ("denegado" = no puede cogerlo)
        costes: {
            jugador1278: 1,           // WETHERBY
            jugador2935: 1,           // BREWER
            jugador3194: 1,           // CRANE
            jugador4781: "denegado",  // NICHOLS
            jugador5261: 1,           // PICKMAN
            jugador6193: "denegado"   // RICE
        },
        // Descripción normal del hotspot: se ve si ya se han llevado el objeto o si el jugador está denegado
        info: {
            titulo: "El abrigo negro",
            texto: "Un gabán largo, de paño pesado, cuelga con los hombros hundidos, como si su dueño hubiera sido arrancado de él de golpe. Los bolsillos están hinchados de cosas que preferís no imaginar. El forro huele a incienso rancio y a algo más antiguo, a piedra mojada de cripta; y cuando lo rozáis con los dedos juraríais que el paño se contrae, apenas, igual que la piel de un animal dormido."
        },
        textoExito: "Has sacado la nota anónima del bolsillo y la guardas en tu inventario."
    },

    municion_revolver1: {
        item: "municion_revolver1",
        titulo: "Munición para revólver",
        nombre: "Munición para revólver",
        imagen: "images/municion_revolver1.jpg",
        descripcion: "Oculta tras el paraguas empapado, en el fondo del paragüero de latón, descansa una ajada caja de cartón con balas de revólver.",
        // Puntos de Acción que paga CADA jugador ("denegado" = no puede cogerlo)
        costes: {
            jugador1278: 1,           // WETHERBY
            jugador2935: 1,           // BREWER
            jugador3194: 1,           // CRANE
            jugador4781: 1,           // NICHOLS
            jugador5261: 1,           // PICKMAN
            jugador6193: 1            // RICE
        },
        // Descripción normal del hotspot: se ve si ya se han llevado el objeto o si el jugador está denegado
        info: {
            titulo: "El paragüero",
            texto: "Un paraguas plegado, de tela ajada, descansa en un paragüero de latón. Está empapado. A sus pies se extiende un pequeño charco negro y espeso que se agita sin que nadie lo toque, con un goteo lento cuyo compás no es el de la gravedad. Ninguno de vosotros recuerda haber visto llover."
        },
        textoExito: "Has cogido la caja de munición y la guardas en tu inventario."
    }
};

const AUDIO_CLICK = "audio/click.mp3";
const AUDIO_CLING = "audio/cling.mp3";
const AUDIO_NOPE = "audio/nope.mp3";
const AUDIO_PICKUP = "audio/pickup.mp3";
const AUDIO_PUERTA = "audio/opendoor.mp3";
const AUDIO_CAJON = "audio/abrircajon.mp3";

let jugadorActual = "JUGADOR";

function nombreVisible(id) { return NOMBRES_JUGADORES[id] || id.toUpperCase(); }

function actualizarIdentidadJugador() {
    const urlParams = new URLSearchParams(window.location.search);
    const jugadorUrl = urlParams.get('jugador');
    if (jugadorUrl) {
        jugadorActual = jugadorUrl.trim();
        localStorage.setItem('jugador_activo_global', jugadorActual);
    } else {
        jugadorActual = localStorage.getItem('jugador_activo_global') || "JUGADOR";
    }
    document.getElementById('identidadTexto').innerText = `IDENTIDAD: ${nombreVisible(jugadorActual)}`;
    localStorage.setItem('jugador_nombre_real', nombreVisible(jugadorActual));
    registrarUbicacion('vestibulo');
}

let ubicacionActual = '';
function registrarUbicacion(sala) {
    if (jugadorActual === "JUGADOR") return;
    ubicacionActual = sala;
    escribirUbicacionFirebase();
}
function escribirUbicacionFirebase() {
    if (!ubicacionActual || jugadorActual === "JUGADOR") return;
    if (typeof firebase === 'undefined' || !firebase.apps.length) return; // aún no está listo
    const fichaRef = firebase.database().ref('jugadores/' + jugadorActual);
    fichaRef.once('value').then(snap => {
        if (snap.exists()) return fichaRef.child('ubicacion').set(ubicacionActual);
    }).catch(err => console.error('Error al guardar la ubicación en Firebase:', err));
}

function sonar(archivo) {
    if (!archivo) return;
    new Audio(archivo).play().catch(e => {});
}
function playClick() { sonar(AUDIO_CLICK); }
function sonarNope() { sonar(AUDIO_NOPE); }

// =====================================================================
// JUGADOR MUERTO (vida 0 en Firebase: jugadores/<id>/vida)
// Un jugador muerto no puede coger objetos ni hacer nada con ellos. Solo puede mirar.
// =====================================================================
let vidaJugador = null;   // se mantiene al día en tiempo real (ver listener tras initializeApp)
function estoyMuerto() {
    if (vidaJugador === null || vidaJugador === undefined || vidaJugador === '') return false;
    const n = Number(vidaJugador);
    return isFinite(n) && n <= 0;
}
// Devuelve true (y avisa) si el jugador está muerto: la acción debe cancelarse.
function bloquearSiMuerto() {
    if (!estoyMuerto()) return false;
    sonar('audio/muerto.mp3');
    openModal("Has muerto", `<p style="color:var(--sangre)">Lo siento. Estás muerto. No puedes hacer nada.</p>${btnCerrar()}`);
    return true;
}





// =====================================================================
// CUENTA ATRÁS DE LA PUERTA AL ENTRAR EN LA SALA
// ---------------------------------------------------------------------
// USAR_CUENTA_ATRAS = true  -> cuenta atrás normal: 10 s con el cartel
//                              "PUERTA CERRADA", suena cling.mp3 al final
//                              y entonces aparece VOLVER AL PASILLO.
// USAR_CUENTA_ATRAS = false -> SIN cuenta atrás: el botón VOLVER AL PASILLO
//                              aparece al instante, sin sonido de cling.
// Para volver a activarla en el futuro, cambia false por true.
// =====================================================================
const USAR_CUENTA_ATRAS = false;

// Segundos que dura la cuenta atrás (solo se usa si USAR_CUENTA_ATRAS = true).
let timeLeft = 10;

const countdownEl = document.getElementById('countdown');
const timerContainerEl = document.getElementById('timerContainer');
const backBtnEl = document.getElementById('backBtn');

if (USAR_CUENTA_ATRAS) {
    // ---- MODO CON CUENTA ATRÁS (el comportamiento original) ----
    const timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) countdownEl.innerText = "00:" + (timeLeft < 10 ? "0" : "") + timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            sonar(AUDIO_CLING);                       // mp3 del final de la cuenta atrás
            timerContainerEl.style.display = 'none';  // oculta el cartel "PUERTA CERRADA"
            backBtnEl.style.display = 'block';        // muestra VOLVER AL PASILLO
        }
    }, 1000);
} else {
    // ---- MODO SIN CUENTA ATRÁS ----
    // No hay intervalo ni sonido de cling: se oculta el cartel y
    // se muestra directamente el botón VOLVER AL PASILLO.
    timerContainerEl.style.display = 'none';
    backBtnEl.style.display = 'block';
}

// =====================================================================
// COSTE DE PA POR JUGADOR  +  "DENEGADO"
// ---------------------------------------------------------------------
// Cada objeto tiene una tabla "costes" con lo que paga CADA jugador:
//   · un número  → Puntos de Acción que le cuesta cogerlo a ESE jugador
//   · "denegado" → ese jugador no puede cogerlo
//   · jugador que no aparezca en la tabla → también denegado
// Si el objeto ya se lo llevaron, o el jugador está denegado, NO se avisa de nada:
// se muestra la descripción normal del hotspot (cfg.info), igual que si no hubiese objeto.
// =====================================================================
function costeDe(tabla) {
    const c = tabla ? tabla[jugadorActual] : undefined;
    if (c === undefined || c === "denegado") return null;
    const n = Number(c);
    return (isFinite(n) && n >= 0) ? n : null;
}

// Descripción normal del hotspot (la de siempre): se usa cuando no hay objeto que coger.
function mostrarDescripcion(cfg) {
    abrirInfo(cfg.info.titulo, cfg.info.texto);
}

let recogidaActual = null;

function accionRecoger(clave) {
    if (bloquearSiMuerto()) return;
    const cfg = OBJETOS[clave];

    // Jugador denegado: ve solo la descripción del hotspot, sin pistas de que hay un objeto.
    if (costeDe(cfg.costes) === null) { mostrarDescripcion(cfg); return; }

    openModal(cfg.info.titulo, `<p style="color:var(--verdin)">Examinando...</p>`);

    // Consulta en la base de datos correcta (logia-rol-vivo)
    firebase.database().ref('localizaciones/' + SALA_ID + '/' + cfg.item).once('value')
        .then(snapshot => {
            const datos = snapshot.val();
            if (datos && datos.disponible === false) {   // ya se lo han llevado
                mostrarDescripcion(cfg);
                return;
            }

            const coste = costeDe(cfg.costes);
            recogidaActual = cfg;
            openModal(cfg.titulo, `
                <p>${cfg.descripcion}</p>
                <img src="${cfg.imagen}" alt="${cfg.nombre}" class="drawer-img" onclick="playClick(); showFullscreenImage('${cfg.imagen}')">
                <div class="cost-box">¿Deseas coger «${cfg.nombre}»?<br>Coste: ${coste} Punto de Acción</div>
                <div class="fila-botones">
                    <button class="drawer-btn" onclick="playClick(); procesarRecogidaFirebase('${cfg.item}')">Sí, coger</button>
                    <button class="drawer-btn no" onclick="playClick(); closeModal()">No, dejar</button>
                </div>
            `);
        })
        .catch(err => {
            console.error("Error leyendo Firebase:", err);
            openModal("Error", `<p style="color:var(--sangre)">No se pudo conectar con Firebase.</p>${btnCerrar()}`);
        });
}

function procesarRecogidaFirebase(itemKey) {
    if (bloquearSiMuerto()) return;
    const cfg = OBJETOS[itemKey];
    const coste = costeDe(cfg.costes);
    if (coste === null) { mostrarDescripcion(cfg); return; }   // por seguridad (denegado)
    openModal(cfg.titulo, `<p style="color:var(--verdin)">Guardando objeto en tu inventario...</p>`);

    // Los Puntos de Acción se cobran en Firebase (jugadores/<jugador>/puntos_accion).
    const refPA = firebase.database().ref('jugadores/' + jugadorActual + '/puntos_accion');
    const devolverPA = () => refPA.transaction(a => (Number(a) || 0) + coste);

    refPA.once('value')
        .then(snap => {
            const pa = Number(snap.val()) || 0;
            if (pa < coste) return { sinPA: true };
            return refPA.transaction(actual => {
                if (actual === null) return pa - coste;       // primera pasada (sin caché): el servidor la corrige
                const saldo = Number(actual) || 0;
                if (saldo < coste) return;                    // sin PA suficientes: se cancela
                return saldo - coste;
            }).then(res => ({ sinPA: !res.committed }));
        })
        .then(cobro => {
            if (cobro.sinPA) {
                sonarNope();
                openModal(cfg.titulo, `<p style="color:var(--sangre)">No tienes suficientes Puntos de Acción.</p>${btnCerrar()}`);
                return;
            }

            // PA ya cobrados en Firebase: en una sola escritura atómica el objeto pasa al inventario
            // del jugador (inventarios/<jugador>/<objeto> = true, lo que ve inventario.html) y queda
            // marcado como cogido en la sala (localizaciones/<SALA_ID>/<objeto>/disponible = false).
            const actualizacion = {};
            actualizacion['inventarios/' + jugadorActual + '/' + cfg.item] = true;
            actualizacion['localizaciones/' + SALA_ID + '/' + cfg.item + '/disponible'] = false;

            return firebase.database().ref().update(actualizacion)
                .then(() => {
                    sonar(AUDIO_PICKUP);
                    openModal(cfg.titulo, `<p style="color:var(--brillo)">${cfg.textoExito}</p>${btnCerrar('Continuar')}`);
                })
                .catch(err => { devolverPA(); throw err; }); // si no se guarda, se devuelven los PA
        })
        .catch(err => {
            console.error("Error de red:", err);
            openModal("Error", `<p style="color:var(--sangre)">Error de conexión con el servidor.</p>${btnCerrar()}`);
        });
}

// =====================================================================
// CAJÓN DE LA MESITA  (hotspot #hsCajon)  ·  necesita LLAVE
// ---------------------------------------------------------------------
// Flujo (todo en Firebase, igual que el armario de la plantilla):
//   · Si el revólver ya se lo llevaron (localizaciones/<sala>/revolver1/disponible
//     = false) → TODOS ven "cajón vacío" (texto + imagen + sonido), tengan o no llave.
//   · Si el jugador está denegado o NO tiene ninguna de las llaves → "Cajón cerrado"
//     con el botón CERRAR, como un hotspot cualquiera.
//   · Si tiene la llave (NO se gasta) → suena abrircajon.mp3, se le dice que ha
//     abierto el cajón y que había un revólver, y se le pregunta si lo coge
//     (coste de PA por jugador). Al cogerlo, el cajón queda vacío para todos.
//   · El revólver se reclama de forma atómica: si dos jugadores lo cogen a la
//     vez, solo uno se lo queda (al otro se le devuelven los PA).
//   · Si otro jugador se lo lleva mientras alguien tiene abierta la oferta, esa
//     oferta pasa sola a "cajón vacío" (ver el listener tras initializeApp).
// =====================================================================
const CAJON = {
    item: "revolver1",                       // objeto del inventario / localizaciones (arma: <tipo><número>)
    titulo: "Cajón de la mesita",
    nombre: "Revólver",
    imagen: "images/cajon_abierto.jpg",
    imagenVacio: "images/cajon_vacio.jpg",
    imagenCerrado: "images/cajon_cerrado.jpg",
    llaves: ["llave_cajon"],                 // ← con cualquiera de estas llaves se abre (cámbiala por la tuya)
    gastarLlave: true,                      // true = la llave se descarta al coger el revólver · false = se queda en el inventario
    // Puntos de Acción que paga CADA jugador ("denegado" = no puede abrirlo, con comillas)
    costes: {
        jugador1278: 1,           // WETHERBY
        jugador2935: 1,       	  // BREWER
        jugador3194: 1,           // CRANE
        jugador4781: 1,           // NICHOLS
        jugador5261: 1,           // PICKMAN
        jugador6193: 1            // RICE
    },
    textoCerrado: "El cajón está cerrado. Necesita una llave.",
    textoDenegado: "El cajón está cerrado y no puedes abrirlo.",
    descripcion: "Has abierto el cajón con la llave. Dentro hay un revólver.",
    textoExito: "Has sacado el revólver del cajón y lo guardas en tu inventario.",
    tituloVacio: "Cajón vacío",
    textoVacio: "El cajón está abierto y vacío. Solo queda el paño de fieltro, con la marca de lo que guardaba."
};

// ¿Tiene el jugador este objeto? (sin distinguir mayúsculas). 'inv' = inventarios/<jugador>
function tieneObjeto(inv, nombreObjeto) {
    inv = inv || {};
    const buscado = String(nombreObjeto).toLowerCase().trim();
    return Object.keys(inv).some(k => k.toLowerCase().trim() === buscado && inv[k] === true);
}

// Pop-up "Cajón cerrado" con su imagen y el botón Cerrar (lo comparten sin llave y denegado).
function popupCajonCerrado(texto) {
    pararAudioInfo();
    openModal('Cajón cerrado', `
        <p>${texto}</p>
        <img src="${CAJON.imagenCerrado}" alt="Cajón cerrado" class="drawer-img" onclick="playClick(); showFullscreenImage('${CAJON.imagenCerrado}')">
        ${btnCerrar()}`);
}

function mostrarCajonCerrado() {
    popupCajonCerrado(CAJON.textoCerrado);
}

// Jugador denegado: el cajón sigue cerrado y él no puede abrirlo.
// (Cuando el cajón ya está abierto y vacío, ve lo mismo que todos: mostrarCajonVacio.)
function mostrarCajonDenegado() {
    popupCajonCerrado(CAJON.textoDenegado);
}

// Cajón vacío: texto normal + imagen + sonido, para cualquier jugador.
function mostrarCajonVacio() {
    pararAudioInfo();
    openModal(CAJON.tituloVacio, `
        <p>${CAJON.textoVacio}</p>

    audioInfo.play().catch(e => {});
}

// Cajón abierto con la llave: sonido + oferta de coger el revólver.
function mostrarOfertaCajon(coste) {
    const cfg = CAJON;
    pararAudioInfo();
    openModal(cfg.titulo, `
        <span id="cajonOferta" style="display:none"></span>
        <p>${cfg.descripcion}</p>
        <img src="${cfg.imagen}" alt="${cfg.nombre}" class="drawer-img" onclick="playClick(); showFullscreenImage('${cfg.imagen}')">
        <div class="cost-box">¿Deseas coger «${cfg.nombre}»?<br>Coste: ${coste} Punto de Acción</div>
        <div class="fila-botones">
            <button class="drawer-btn" onclick="playClick(); procesarRecogidaCajon()">Sí, coger</button>
            <button class="drawer-btn no" onclick="playClick(); closeModal()">No, dejar</button>
        </div>`);
    audioInfo = new Audio(AUDIO_CAJON);
    audioInfo.play().catch(e => {});
}

function accionCajon() {
    if (bloquearSiMuerto()) return;
    const cfg = CAJON;
    const db = firebase.database();
    openModal(cfg.titulo, `<p style="color:var(--verdin)">Examinando...</p>`);

    db.ref('localizaciones/' + SALA_ID + '/' + cfg.item + '/disponible').once('value')
        .then(snapDisp => {
            // 1) ¿Ya se llevaron el revólver? → vacío para todos
            if (snapDisp.val() === false) { mostrarCajonVacio(); return; }

            // 2) Jugador denegado → solo ve el cajón cerrado
            const coste = costeDe(cfg.costes);
            if (coste === null) { mostrarCajonDenegado(); return; }

            // 3) ¿Tiene alguna de las llaves? (la llave NO se gasta)
            return db.ref('inventarios/' + jugadorActual).once('value').then(snapInv => {
                const inventario = snapInv.val() || {};
                if (!cfg.llaves.some(llave => tieneObjeto(inventario, llave))) {
                    mostrarCajonCerrado();
                    return;
                }
                mostrarOfertaCajon(coste);
            });
        })
        .catch(err => {
            console.error("Error leyendo Firebase:", err);
            openModal("Error", `<p style="color:var(--sangre)">No se pudo conectar con Firebase.</p>${btnCerrar()}`);
        });
}

function procesarRecogidaCajon() {
    if (bloquearSiMuerto()) return;
    const cfg = CAJON;
    const coste = costeDe(cfg.costes);
    if (coste === null) { mostrarCajonDenegado(); return; }   // por seguridad (denegado)
    openModal(cfg.titulo, `<p style="color:var(--verdin)">Guardando objeto en tu inventario...</p>`);

    const db = firebase.database();
    const refPA = db.ref('jugadores/' + jugadorActual + '/puntos_accion');
    const refDisp = db.ref('localizaciones/' + SALA_ID + '/' + cfg.item + '/disponible');
    const devolverPA = () => refPA.transaction(a => (Number(a) || 0) + coste);
    let paCobrados = false, reclamado = false;

    refPA.once('value')
        .then(snap => {
            const pa = Number(snap.val()) || 0;
            if (pa < coste) return { sinPA: true };
            return refPA.transaction(actual => {
                if (actual === null) return pa - coste;       // primera pasada (sin caché): el servidor la corrige
                const saldo = Number(actual) || 0;
                if (saldo < coste) return;                    // sin PA suficientes: se cancela
                return saldo - coste;
            }).then(res => ({ sinPA: !res.committed }));
        })
        .then(cobro => {
            if (cobro.sinPA) {
                sonarNope();
                openModal(cfg.titulo, `<p style="color:var(--sangre)">No tienes suficientes Puntos de Acción.</p>${btnCerrar()}`);
                return;
            }
            paCobrados = true;

            // Reclamo atómico: solo un jugador consigue marcar el revólver como cogido.
            return refDisp.transaction(actual => (actual === false) ? undefined : false).then(res => {
                if (!res.committed) {                         // otro jugador se lo llevó justo antes
                    paCobrados = false;
                    devolverPA().catch(e => console.error("No se pudieron devolver los PA:", e));
                    mostrarCajonVacio();
                    return;
                }
                reclamado = true;
                const cambios = {};
                cambios['inventarios/' + jugadorActual + '/' + cfg.item] = true;
                if (cfg.gastarLlave) cfg.llaves.forEach(l => cambios['inventarios/' + jugadorActual + '/' + l] = null);
                return db.ref().update(cambios).then(() => {
                    sonar(AUDIO_PICKUP);
                    openModal(cfg.titulo, `<p style="color:var(--brillo)">${cfg.textoExito}</p>${btnCerrar('Continuar')}`);
                });
            });
        })
        .catch(err => {
            if (reclamado) refDisp.set(true).catch(e => console.error("No se pudo liberar el revólver:", e));
            if (paCobrados) devolverPA().catch(e => console.error("No se pudieron devolver los PA:", e));
            console.error("Error de red:", err);
            openModal("Error", `<p style="color:var(--sangre)">Error de conexión con el servidor.</p>${btnCerrar()}`);
        });
}
