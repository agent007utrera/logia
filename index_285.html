<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesinato en la Logia del Crepúsculo de Plata</title>

<!--
╔══════════════════════════════════════════════════════════════════════╗
║  PANTALLA DE INICIO · ASESINATO EN LA LOGIA DEL CREPÚSCULO DE PLATA  ║
╠══════════════════════════════════════════════════════════════════════╣
║  Misma mecánica que el index de Outpost 31:                          ║
║   1. Intro con el rótulo del estudio y el vídeo a pantalla completa. ║
║   2. Botón CONTINUAR → selección de identidad (6 jugadores).         ║
║   3. Se pulsa una tarjeta → pide la clave del jugador.               ║
║   4. Si es correcta: guarda la identidad en localStorage, abre el    ║
║      panel del jugador (jugadorXXXX.html) en una pestaña nueva y     ║
║      lleva la pestaña actual a su sala de inicio.                    ║
║                                                                      ║
║  QUÉ EDITAR (todo está en el <script>, apartado "CONFIGURACIÓN"):    ║
║   · Lista de jugadores (nombre, clave, foto, profesión).             ║
║   · Sala a la que va cada jugador al entrar.                         ║
║   · Colores y fuentes: variables en ":root" del <style>.             ║
╚══════════════════════════════════════════════════════════════════════╝
-->

<!-- Tipografías: Cinzel (títulos), IM Fell English (texto), Special Elite (máquina de escribir 1920s) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   1. PALETA Y FUENTES (cambia aquí y cambia en toda la pantalla)
   ========================================================================== */
:root {
    --bg-color:      #040806;   /* fondo más profundo */
    --dark-accent:   #0e2016;   /* fondo de tarjetas y cajas */
    --text-color:    #d9d3b3;   /* texto principal (pergamino) */
    --text-muted:    #8fa08a;   /* texto secundario */
    --accent-color:  #3e9a6b;   /* verde esmeralda (botones, bordes) */
    --accent-glow:   #9bf0c0;   /* verde brillante (brillos, títulos) */
    --verdin:        #5fb98a;   /* verde medio */
    --laton:         #b49a55;   /* latón envejecido (marcos) */
    --laton-osc:     #6e5c2e;   /* latón oscuro (filos interiores) */
    --sangre:        #a8423a;   /* errores */
    --font-title:    'Cinzel Decorative', 'Cinzel', Georgia, serif;
    --font-sub:      'Cinzel', Georgia, serif;
    --font-text:     'IM Fell English', Georgia, 'Times New Roman', serif;
    --font-machine:  'Special Elite', 'Courier New', monospace;
}

* { box-sizing: border-box; user-select: none; }

/* ==========================================================================
   2. BASE: fondo, viñeta y grano de película antigua
   ========================================================================== */
body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 40%, #0f2318 0%, #030705 80%);
    color: var(--text-color);
    font-family: var(--font-text);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}
/* Viñeta oscura en los bordes (no bloquea clics) */
body::before {
    content: ""; position: fixed; inset: 0;
    pointer-events: none; z-index: 20000;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
}
/* Grano de película (ruido generado con un filtro SVG) */
body::after {
    content: ""; position: fixed; inset: 0;
    pointer-events: none; z-index: 20001;
    opacity: 0.09; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* Vídeo de fondo de la pantalla de selección (videos/intro2.mp4) */
#bg-video-seleccion {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: 0;
    filter: brightness(0.4);   /* solo oscurece, sin tinte */
}

/* ==========================================================================
   3. INTRO (rótulo del estudio + vídeo con zoom + botón CONTINUAR)
   ========================================================================== */
#intro-overlay {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    background-color: #000;
    z-index: 9999;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    overflow: hidden;
    transition: opacity 1.2s ease;
}
/* Rótulo "UTRERA PRODUCTIONS": aparece y se desvanece */
#studio-text {
    font-family: var(--font-title);
    color: var(--accent-glow);
    font-size: 2.6rem;
    letter-spacing: 8px;
    text-shadow: 0 0 22px rgba(155,240,192,0.7);
    opacity: 0;
    transition: opacity 2s ease-in-out;
    position: absolute;
    text-align: center;
    padding: 0 20px;
}
#studio-text::after {            /* filete decorativo bajo el rótulo */
    content: ""; display: block; margin-top: 14px;
    font-size: 0.8rem; color: var(--laton); letter-spacing: 0;
}
/* Vídeo de intro: empieza pequeño y se agranda */
#zoom-container {
    position: absolute; width: 100vw; height: 100vh;
    display: none; justify-content: center; align-items: center;
    background: #000; overflow: hidden;
}
#zoom-image {
    width: 100vw; height: 100vh; object-fit: cover;
    transform: scale(0.1); opacity: 0;
    transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.5s ease-in;
}
#zoom-container.active #zoom-image { transform: scale(1); opacity: 1; }

/* Botón CONTINUAR (aparece a los 7 s) */
.continue-btn {
    position: absolute; bottom: 15%;
    font-family: var(--font-sub);
    background: rgba(12, 27, 19, 0.92);
    color: var(--accent-glow);
    border: 1px solid var(--laton);
    outline: 1px solid var(--laton-osc); outline-offset: 3px;
    padding: 12px 42px;
    font-size: 1.15rem; letter-spacing: 6px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(95,185,138,0.4);
    display: none; z-index: 10000;
    transition: all 0.3s ease;
}
.continue-btn:hover {
    background: var(--accent-color); color: #fff;
    box-shadow: 0 0 30px var(--accent-glow);
    transform: scale(1.05);
}

/* ==========================================================================
   4. PANTALLA DE SELECCIÓN DE IDENTIDAD
   ========================================================================== */
.container {
    max-width: 1100px; margin: 0 auto;
    opacity: 0; transition: opacity 1s ease;
    position: relative; z-index: 1;
}
.container.visible { opacity: 1; }

/* Título del juego */
h1 {
    font-family: var(--font-title);
    color: var(--verdin);
    text-align: center;
    font-size: 2.1rem;
    line-height: 1.3;
    letter-spacing: 3px;
    text-shadow: 0 0 14px rgba(95,185,138,0.55), 0 2px 0 #000;
    margin: 18px 0 8px;
}
/* Línea decorativa  ───  ◆  ───  */
.divisor {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin: 0 auto 14px; max-width: 520px;
    color: var(--laton); font-size: 0.8rem;
}
.divisor::before, .divisor::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--laton), transparent);
}
h2 {
    font-family: var(--font-sub);
    color: var(--laton);
    text-align: center;
    font-size: 1.1rem; font-weight: 500;
    letter-spacing: 6px; text-transform: uppercase;
    margin: 0 0 6px;
}
.subtitle {
    text-align: center; font-style: italic;
    color: var(--text-muted);
    font-size: 1.15rem;
    margin-bottom: 35px; letter-spacing: 1px;
}

/* Rejilla de tarjetas (6 jugadores → 3 columnas × 2 filas en pantallas anchas) */
.character-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 26px;
}

/* Tarjeta de jugador: marco de latón de doble filo, como un carné de la Logia */
.char-card {
    position: relative;
    background: linear-gradient(180deg, #14291d 0%, #0b1710 100%);
    border: 2px solid var(--laton-osc);
    box-shadow: 0 0 0 3px #000, 0 6px 14px rgba(0,0,0,0.6);
    padding: 16px;
    display: flex; align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
}
.char-card::before {            /* filo interior fino */
    content: ""; position: absolute; inset: 5px;
    border: 1px solid rgba(110,92,46,0.55);
    pointer-events: none;
}
.char-card:hover {
    transform: translateY(-4px);
    border-color: var(--laton);
    box-shadow: 0 0 0 3px #000, 0 0 20px rgba(95,185,138,0.45);
}

/* Foto: marco de latón y tono daguerrotipo verdoso */
.char-photo {
    width: 85px; height: 105px;
    border: 2px solid var(--laton);
    outline: 1px solid #000;
    object-fit: cover;
    margin-right: 16px;
    background: #000;
    filter: none;
    flex-shrink: 0;
}
.char-info h3 {
    margin: 0;
    font-family: var(--font-sub);
    color: var(--accent-glow);
    font-size: 1.1rem; letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(95,185,138,0.45);
}
.char-info p {
    margin: 8px 0 0;
    font-family: var(--font-machine);
    font-size: 0.78rem;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 2px;
}

/* ==========================================================================
   5. POP-UP DE CLAVE
   ========================================================================== */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at center, rgba(6,16,10,0.82), rgba(0,0,0,0.93));
    display: none;
    justify-content: center; align-items: center;
    z-index: 10000;
    backdrop-filter: blur(3px);
}
.modal-overlay.active { display: flex; }

.password-box {
    position: relative;
    background:
        radial-gradient(ellipse at top, rgba(47,125,87,0.18), transparent 60%),
        linear-gradient(180deg, #14291d 0%, #0b1710 100%);
    border: 2px solid var(--laton);
    box-shadow: 0 0 0 4px #000, 0 0 0 5px var(--laton-osc), 0 10px 40px rgba(0,0,0,0.9), 0 0 40px rgba(47,125,87,0.25);
    padding: 36px 30px 30px;
    text-align: center;
    width: 380px; max-width: 92vw;
    animation: aparecer 0.35s ease-out;
}
.password-box::before {         /* filo interior */
    content: ""; position: absolute; inset: 6px;
    border: 1px solid var(--laton-osc);
    pointer-events: none;
}
@keyframes aparecer {
    from { opacity: 0; transform: translateY(14px) scale(0.96); }
    to   { opacity: 1; transform: none; }
}
.password-box h3 {
    font-family: var(--font-title);
    color: var(--verdin);
    margin: 0 0 6px;
    font-size: 1.3rem; letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(95,185,138,0.5);
}
.password-box p {
    color: var(--text-color);
    font-size: 1.05rem;
    margin: 6px 0 18px;
}
/* Campo de clave: máquina de escribir */
.password-box input {
    background: #050b07;
    border: 1px solid var(--laton);
    color: var(--accent-glow);
    padding: 10px;
    margin-bottom: 20px;
    width: 85%;
    text-align: center;
    font-family: var(--font-machine);
    font-size: 1.2rem; letter-spacing: 4px;
    outline: none;
}
.password-box input:focus { box-shadow: 0 0 12px rgba(95,185,138,0.6); }

.btn-entrar {
    background: linear-gradient(180deg, #1c3d2b, #10261b);
    color: var(--accent-glow);
    border: 1px solid var(--laton);
    padding: 10px 32px;
    cursor: pointer;
    font-family: var(--font-sub);
    font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase;
    transition: all 0.25s;
}
.btn-entrar:hover { background: var(--accent-color); color: #fff; box-shadow: 0 0 14px rgba(155,240,192,0.5); }

.close-btn {
    position: absolute; top: 12px; right: 18px;
    cursor: pointer; font-size: 1.6rem;
    font-family: var(--font-sub);
    color: var(--laton); z-index: 2;
}
.close-btn:hover { color: var(--accent-glow); text-shadow: 0 0 8px var(--accent-glow); }

.error-msg {
    color: #e0675d; font-size: 0.95rem !important;
    margin: 12px 0 0 !important;
    display: none; font-style: italic;
}
.tiembla { animation: temblor 0.4s; }       /* sacudida cuando la clave es errónea */
@keyframes temblor {
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
}

@media (max-width: 700px) {
    h1 { font-size: 1.5rem; }
    #studio-text { font-size: 1.6rem; letter-spacing: 4px; }
}
</style>
</head>
<body>

    <!-- ===== INTRO: rótulo del estudio → vídeo con zoom → botón CONTINUAR ===== -->
    <div id="intro-overlay">
        <div id="studio-text">UTRERA PRODUCTIONS</div>
        <div id="zoom-container">
            <!-- Vídeo de la intro. Cambia la ruta por el de la Logia -->
            <video id="zoom-image" src="videos/intro.mp4" autoplay muted loop playsinline preload="auto"></video>
        </div>
        <button class="continue-btn" id="continueBtn" onclick="startMainMenu()">COMENZAR</button>
    </div>

    <!-- ===== Vídeo de fondo de la selección de identidad ===== -->
    <video id="bg-video-seleccion" src="videos/intro2.mp4" autoplay muted loop playsinline preload="auto"></video>

    <!-- ===== SELECCIÓN DE IDENTIDAD ===== -->
    <div class="container" id="main-content">
        <h1>Asesinato en la Logia<br>del Crepúsculo de Plata</h1>
         <div class="divisor"><span>◆</span></div>
        <h2>Selección de Identidad</h2>
        <div class="subtitle">Elige tu registro personal para entrar en la Logia...</div>
        <!-- Las tarjetas se generan desde el script (lista "players") -->
        <div class="character-grid" id="character-grid"></div>
    </div>

    <!-- ===== POP-UP DE CLAVE ===== -->
    <div class="modal-overlay" id="login-modal">
        <div class="password-box" id="password-box">
            <span class="close-btn" onclick="closeModal('login-modal')">&times;</span>
            <h3>Acceso Restringido</h3>
            <p id="login-instruction">Introduce tu clave de seguridad:</p>
            <input type="text" id="login-input" placeholder="Clave..." autocomplete="off">
            <br>
            <button class="btn-entrar" onclick="checkPlayerLogin()">Entrar</button>
            <p class="error-msg" id="login-error">Clave incorrecta</p>
        </div>
    </div>

    <script>
        /* ##################################################################
           CONFIGURACIÓN
           ################################################################## */

        // ---------------------------------------------------------------
        // LOS 6 JUGADORES
        //   id     → id interno del sistema (el de la hoja de INVENTARIO y
        //            el nombre del archivo del panel: jugador1278.html).
        //   name   → nombre del personaje (los de abajo son de ejemplo).
        //   login  → clave que escribe el jugador para entrar.
        //   photo  → foto de la tarjeta.
        //   job    → profesión que se ve bajo el nombre.
        //   sala   → (opcional) sala a la que va al entrar. Si la omites,
        //            usa SALA_INICIO_POR_DEFECTO.
        // ---------------------------------------------------------------
        const players = [
            { id: "jugador1278", name: "Silas Wetherby",     	login: "1278", photo: "images/f_wetherby.jpg", 	job: "Gran Maestre" },
            { id: "jugador2935", name: "Abel Brewer",         	login: "2935", photo: "images/f_brewer.jpg",    job: "Doctor" },
            { id: "jugador3194", name: "Barnabas Crane",     	login: "3194", photo: "images/f_crane.jpg",     job: "Anticuario" },
            { id: "jugador4781", name: "Jeremiah Nichols",     	login: "4781", photo: "images/f_nichols.jpg", 	job: "Inspector" },
            { id: "jugador5261", name: "Robert Pickman", 	login: "5261", photo: "images/f_pickman.jpg", 	job: "Pintor" },
            { id: "jugador6193", name: "Edmund Rice",       	login: "6193", photo: "images/f_rice.jpg",  	job: "Profesor" }
        ];

        // Sala a la que llegan los jugadores tras identificarse (cámbiala por tu sala inicial).
        // En Outpost 31 había dos grupos (sala_recreo / intro_helicoptero); aquí,
        // si quieres grupos distintos, añade  sala: "otra_sala.html"  a un jugador.
        const SALA_INICIO_POR_DEFECTO = "sala_vestibulo_852.html";

        // Audios (los mismos archivos que ya usas)
        const AUDIO_CLICK   = 'audio/click.mp3';
        const AUDIO_INTRO   = 'audio/intro.mp3';
        const AUDIO_CORRECT = 'audio/correct.mp3';
        const AUDIO_NOPE    = 'audio/nope.mp3';

        /* ##################################################################
           LÓGICA (normalmente no hace falta tocar nada de aquí abajo)
           ################################################################## */

        let selectedPlayer = null;   // jugador cuya tarjeta se ha pulsado

        function reproducirClick() {
            new Audio(AUDIO_CLICK).play().catch(e => console.log("Audio prevent:", e));
        }

        // Al cargar la página: secuencia de la intro
        window.addEventListener('DOMContentLoaded', () => {
            const studioText   = document.getElementById('studio-text');
            const zoomContainer = document.getElementById('zoom-container');
            const continueBtn  = document.getElementById('continueBtn');
            const zoomVideo    = document.getElementById('zoom-image');

            zoomVideo.load();
            zoomVideo.play().catch(e => console.log("Auto-play blocked", e));

            // 0,6 s: aparece el rótulo del estudio
            setTimeout(() => { studioText.style.opacity = '1'; }, 600);
            // 3,2 s: el rótulo se desvanece y arranca el vídeo con zoom
            setTimeout(() => {
                studioText.style.opacity = '0';
                setTimeout(() => {
                    studioText.style.display = 'none';
                    zoomContainer.style.display = 'flex';
                    zoomVideo.play().catch(e => {});
                    setTimeout(() => { zoomContainer.classList.add('active'); }, 50);
                }, 1000);
            }, 3200);
            // 7 s: aparece el botón CONTINUAR
            setTimeout(() => { continueBtn.style.display = 'block'; }, 7000);

            renderizarTarjetas();
        });

        // Pulsar CONTINUAR: música, fundido de la intro y aparición de la selección
        function startMainMenu() {
            reproducirClick();
            new Audio(AUDIO_INTRO).play().catch(e => {});

            const introOverlay = document.getElementById('intro-overlay');
            introOverlay.style.opacity = '0';
            setTimeout(() => {
                introOverlay.style.display = 'none';
                document.getElementById('main-content').classList.add('visible');
            }, 1200);
        }

        // Crea una tarjeta por cada jugador de la lista
        function renderizarTarjetas() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';
            players.forEach(p => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.onclick = () => { reproducirClick(); openLogin(p); };
                card.innerHTML = `
                    <img src="${p.photo}" class="char-photo" alt="${p.name}">
                    <div class="char-info">
                        <h3>${p.name}</h3>
                        <p>${p.job}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Abre el pop-up de clave para el jugador elegido
        function openLogin(player) {
            selectedPlayer = player;
            document.getElementById('login-modal').classList.add('active');
            document.getElementById('login-input').value = '';
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('login-input').focus();
        }

        // Comprueba la clave
        function checkPlayerLogin() {
            const val = document.getElementById('login-input').value.trim().toLowerCase();

            if (val === selectedPlayer.login.toLowerCase()) {
                // ¡CLAVE CORRECTA!
                new Audio(AUDIO_CORRECT).play().catch(e => {});

                // Guarda la identidad activa: las salas y el panel la leen de aquí
                localStorage.setItem('jugador_activo_global', selectedPlayer.id);
                localStorage.setItem('jugador_nombre_real', selectedPlayer.name);

                const salaDestino = selectedPlayer.sala || SALA_INICIO_POR_DEFECTO;

                setTimeout(() => {
                    // 1) Abre el panel del jugador (inventario) en una pestaña nueva
                    window.open(`${selectedPlayer.id}.html`, '_blank');
                    // 2) La pestaña actual va a la sala, para que quede activa y visible
                    window.location.href = `${salaDestino}?jugador=${encodeURIComponent(selectedPlayer.id)}`;
                }, 1800);

            } else {
                // CLAVE INCORRECTA: sonido, mensaje y sacudida
                new Audio(AUDIO_NOPE).play().catch(e => {});
                document.getElementById('login-error').style.display = 'block';
                const caja = document.getElementById('password-box');
                caja.classList.remove('tiembla'); void caja.offsetWidth; caja.classList.add('tiembla');
            }
        }

        function closeModal(id) {
            reproducirClick();
            document.getElementById(id).classList.remove('active');
        }

        // Enter en el campo de clave = pulsar "Entrar"
        document.getElementById('login-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPlayerLogin();
        });
    </script>
</body>
</html>
