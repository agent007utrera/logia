<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#040806; --bosque:#0a1510; --musgo:#12261b; --esmeralda:#2f7d57; --verdin:#5fb98a; --brillo:#9bf0c0;
  --laton:#b49a55; --laton-osc:#6e5c2e; --pergamino:#d9d3b3; --pergamino-osc:#a9a285; --sangre:#a8423a;
  --azul:#3b82f6; --azul-brillo:#8fc1ff;
  --f-sub:'Cinzel',Georgia,serif; --f-cuerpo:'IM Fell English',Georgia,serif; --f-maq:'Special Elite','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at center,#0f2318 0%,#030705 100%);font-family:var(--f-maq);color:var(--pergamino)}

.layout-container{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:8px;padding:8px;width:100%;height:100%}
.map-area{min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#000;
  border:2px solid var(--laton-osc);box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px var(--laton-osc);border-radius:3px}
.map-container{position:relative;aspect-ratio:3251/1772;width:min(100%,calc((100vh - 32px) * 1.8346));box-shadow:0 0 40px rgba(47,125,87,.25)}
.map-container img{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(.95) contrast(1.05)}

.player-hud{position:fixed;top:15px;right:20px;background:rgba(5,12,8,.94);border:1px solid var(--laton);outline:1px solid var(--laton-osc);
  outline-offset:2px;color:var(--verdin);padding:8px 16px;font-size:.9rem;letter-spacing:2px;z-index:1500;box-shadow:0 0 14px rgba(47,125,87,.45);text-align:center}
#video-status-hud{font-size:.7rem;color:var(--pergamino-osc);margin-top:4px;letter-spacing:1px}

/* Hotspots: azul = cuesta 1 PA · verde = gratis · rojo = pide clave */
.hotspot{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:5;
  display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;
  --c:var(--azul);--cb:var(--azul-brillo);background:color-mix(in srgb,var(--c) 65%,transparent);border:2px solid var(--cb);box-shadow:0 0 12px var(--cb)}
.hotspot::after{content:"◆";color:var(--cb);font-size:.7rem}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.25);background:var(--c);box-shadow:0 0 22px var(--cb)}
.hotspot-green{--c:#00b45a;--cb:#4dffa6}
.hotspot-red{--c:#d42a2a;--cb:#ff5a5a}
.hotspot-badge{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:1.25rem;margin-top:2px;pointer-events:none;filter:drop-shadow(0 2px 4px #000)}
.hotspot .tooltip{position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:rgba(5,12,8,.96);color:var(--laton);
  padding:4px 10px;font-family:var(--f-sub);font-size:.78rem;white-space:nowrap;border:1px solid var(--laton-osc);border-radius:2px;
  opacity:0;pointer-events:none;transition:opacity .2s;letter-spacing:2px;box-shadow:0 4px 10px #000}
.hotspot:hover .tooltip{opacity:1}

/* Barra lateral de cámaras (webcams.js la rellena) */
.video-sidebar{background:rgba(4,9,6,.96);border:2px solid var(--laton-osc);box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px var(--laton-osc);
  display:flex;flex-direction:column;overflow:hidden;border-radius:3px;min-width:0;min-height:0}
.video-header{padding:12px 10px;background:linear-gradient(180deg,#0f2318,#08120d);border-bottom:1px solid var(--laton-osc);color:var(--laton);
  font-family:var(--f-sub);font-size:.85rem;text-align:center;letter-spacing:3px}
#video-status{display:block;margin-top:4px;color:var(--pergamino-osc);font-family:var(--f-maq);font-size:.68rem;letter-spacing:1px}

#video-grid {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Crea exactamente 2 columnas iguales */
    gap: 8px;                              /* Espacio de separación entre las webcams */
    align-content: start;                  /* Alinea las filas hacia arriba ordenadamente */
}

.video-card {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3; /* Mantiene la proporción clásica de cámara */
    background: #000;
    border: 1px solid #1a3a5c;
    border-radius: 4px;
    overflow: hidden;
}

.video-card video{width:100%;height:100%;display:block;object-fit:cover}
.video-name{position:absolute;left:5px;bottom:5px;max-width:calc(100% - 10px);padding:2px 6px;background:rgba(5,12,8,.88);color:var(--brillo);
  font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--laton-osc);border-radius:2px}
.video-card::before{content:"• REC";color:var(--sangre);position:absolute;top:6px;right:8px;font-size:.65rem;letter-spacing:1px;z-index:2}
.aforo-aviso{color:var(--laton);font-family:var(--f-sub);font-size:.72rem;letter-spacing:3px;text-align:center;margin:0;padding:6px;
  border-top:1px solid var(--laton-osc);background:#060d09;display:flex;align-items:center;justify-content:space-between}
.aforo-aviso button{background:var(--musgo);border:1px solid var(--laton-osc);color:var(--brillo);padding:2px 8px;font-size:.9rem;cursor:pointer;flex-shrink:0;position:relative;overflow:hidden}
.aforo-aviso button.off{background:#2a0e0b;border-color:var(--sangre);color:var(--sangre)}
.aforo-aviso button.off::after{content:"";position:absolute;top:50%;left:-20%;width:140%;height:2px;background:var(--sangre);transform:translateY(-50%) rotate(-45deg)}

/* Ventana modal */
#codeModal{position:fixed;inset:0;background:rgba(3,6,4,.9);display:none;justify-content:center;align-items:center;z-index:1100;backdrop-filter:blur(3px)}
.code-modal-box{position:relative;width:min(92vw,400px);padding:28px 26px;display:flex;flex-direction:column;gap:14px;text-align:center;
  background:linear-gradient(160deg,#0f2318,#08120d);border:2px solid var(--laton);outline:1px solid var(--laton-osc);outline-offset:4px;
  border-radius:3px;box-shadow:0 0 40px rgba(47,125,87,.4),inset 0 0 30px rgba(0,0,0,.6)}
.code-modal-box h3{font-family:var(--f-sub);font-size:1.05rem;color:var(--laton);letter-spacing:3px;font-weight:700}
.code-modal-box p{font-family:var(--f-cuerpo);font-size:1.05rem;line-height:1.4;color:var(--pergamino)}
.sello{font-size:2.2rem;filter:drop-shadow(0 0 10px var(--sangre))}
.code-modal-input{background:#02050a;border:1px solid var(--laton-osc);color:var(--brillo);font-family:var(--f-maq);font-size:1.2rem;padding:10px;text-align:center;letter-spacing:4px;outline:none;border-radius:2px}
.code-modal-input:focus,.digito:focus{border-color:var(--brillo);box-shadow:0 0 10px rgba(155,240,192,.45)}
.digitos{display:flex;gap:10px;justify-content:center}
.digito{width:52px;height:64px;background:#02050a;border:2px solid var(--laton-osc);border-radius:3px;color:var(--brillo);font-family:var(--f-maq);font-size:1.9rem;text-align:center;outline:none;caret-color:transparent;transition:border-color .2s}
.digitos.error .digito{border-color:var(--sangre);color:#ff8a80;animation:temblor .4s}
@keyframes temblor{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.error-msg{font-family:var(--f-cuerpo);font-size:.95rem;color:#e0786f;min-height:18px;font-style:italic}
.code-modal-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.code-modal-btn{background:var(--musgo);border:1px solid var(--laton-osc);color:var(--pergamino);padding:8px 18px;font-family:var(--f-sub);font-size:.8rem;cursor:pointer;letter-spacing:2px;border-radius:2px}
.code-modal-btn:hover{border-color:var(--brillo);color:var(--brillo)}
.btn-si{background:#1d5a3b;border-color:var(--verdin)} .btn-no{background:#4a1a16;border-color:var(--sangre)}
.btn-rojo{background:#5a1d19;border-color:#d4594f;color:#ffd6d1}

@media (max-width:820px){
  .layout-container{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 170px}
  .map-container{width:100%} .player-hud{top:8px;right:8px;font-size:.7rem;padding:5px 8px}
  .hotspot{width:24px;height:24px}
}
@media (prefers-reduced-motion:reduce){.digitos.error .digito{animation:none}}
</style>
</head>
<body>

<div class="player-hud" id="playerHud">
  <div id="identidadTexto">IDENTIDAD: CARGANDO...</div>
  <div id="video-status-hud">Conectando...</div>
</div>

<div id="codeModal"><div class="code-modal-box"><h3 id="modalTitle"></h3><div id="modalDynamicBody"></div></div></div>

<div class="layout-container">
  <main class="map-area">
    <div class="map-container">
      <img src="images/mapa.png" alt="Plano de la mansión">
      <div class="hotspot" id="hotspot-observatorio" style="top:26%;left:13%" onclick="checkRoomAccess('observatorio','sala_observatorio_654.html')"><span class="tooltip">Observatorio</span></div>
      <div class="hotspot hotspot-green" id="hotspot-salon" style="top:30%;left:42.5%" onclick="checkRoomAccess('salon','sala_salon_753.html')"><span class="tooltip">Salón</span></div>
      <div class="hotspot" id="hotspot-comedor" style="top:30%;left:55%" onclick="checkRoomAccess('comedor','sala_comedor_357.html')"><span class="tooltip">Comedor</span></div>
      <div class="hotspot" id="hotspot-biblioteca" style="top:24%;left:67%" onclick="checkRoomAccess('biblioteca','sala_biblioteca_159.html')"><span class="tooltip">Biblioteca</span></div>
      <div class="hotspot" id="hotspot-vestibulo" style="top:51%;left:48.5%" onclick="checkRoomAccess('vestibulo','sala_vestibulo_852.html')"><span class="tooltip">Vestíbulo</span></div>
      <div class="hotspot" id="hotspot-jardin" style="top:48%;left:81.5%" onclick="checkRoomAccess('jardin','sala_jardin_456.html')"><span class="tooltip">Jardín</span></div>
      <div class="hotspot hotspot-red" id="hotspot-santuario" style="top:75.5%;left:13%" onclick="checkRoomAccess('santuario','sala_santuario_927.html')"><span class="tooltip">Santuario</span></div>
      <div class="hotspot" id="hotspot-celdas" style="top:80.5%;left:34%" onclick="checkRoomAccess('celdas','sala_celdas_258.html')"><span class="tooltip">Celdas</span></div>
    </div>
  </main>

  <aside class="video-sidebar">
    <div class="video-header">#<span id="video-status">Conectando...</span></div>
    <div id="video-grid"></div>
    <p class="aforo-aviso">
      <button id="btnMic" onclick="toggleMicrofono()">🎤</button>
      PASILLO
      <button id="btnCam" onclick="toggleCamara()">📷</button>
    </p>
  </aside>
</div>

<script>
/* ===================== CONFIGURACIÓN ===================== */
const SCRIPT_INVENTARIO_URL     = "https://script.google.com/macros/s/AKfycbyFlw7NweduEa57nhJhGibvkWpVdluFKTJwgRBttp9HdXRNC9IazEld9OMD40V2uP7kPg/exec";
const SCRIPT_LOCALIZACIONES_URL = "https://script.google.com/macros/s/AKfycbwbAHuptDPb2POUQgcxhVK2z00vEBnvwVx9h6DjDW_ZGdzSbVLOs1eqZwNbDh_o3XtL/exec";
const SCRIPT_ACTIVACIONES_URL   = "https://script.google.com/macros/s/AKfycbykm1ehNnO8QoekCMyWBF3NhfJX_66ratokSy2dvmHF2r-dv3kCu53utOqluZuy-rEH/exec";
// Registro de la sala en la que está cada jugador (opcional). Vacío = no se registra.
const SCRIPT_UBICACIONES_URL = "https://script.google.com/macros/s/AKfycbxwLCZAmRy_MHZQWALu5Y_8hLGjc5jY2UcZtctuPDNfzBDPrMJIEVDSZWGUr7nS-TYJgQ/exec";

const salasLibres = ['salon'];                 // entran sin gastar PA
const TODOS = ["jugador1278","jugador2935","jugador3194","jugador4781","jugador5261","jugador6193","jugador7419","jugador8539"];
const costesParaTodos = (n, ex) => Object.assign(Object.fromEntries(TODOS.map(j => [j, n])), ex || {});

// clave: contraseña de 4 cifras · costesPA: PA por jugador ("denegado" = no puede entrar)
const locationConfigs = {
  observatorio: { title:"Observatorio", costesPA: costesParaTodos(1) },
  salon:        { title:"Salón",        costesPA: costesParaTodos(0) },
  comedor:      { title:"Comedor",      costesPA: costesParaTodos(1) },
  biblioteca:   { title:"Biblioteca",   costesPA: costesParaTodos(1) },
  vestibulo:    { title:"Vestíbulo",    costesPA: costesParaTodos(1) },
  jardin:       { title:"Jardín",       costesPA: costesParaTodos(1) },
  santuario:    { title:"Santuario",    costesPA: costesParaTodos(1), clave: "1724" },
  celdas:       { title:"Celdas",    	costesPA: costesParaTodos(1) }
};

// Puertas abiertas por el máster desde Firebase: puertas/<sala>/abierta
const puertasAbiertas = {};

const ICONOS = { observatorio:'🔭', salon:'🛋️', comedor:'🍽️', biblioteca:'📚', vestibulo:'🚪', jardin:'🌳', santuario:'🔮', celdas:'⛓️' };

const capMap = { "1278":"jugador1278","2935":"jugador2935","3194":"jugador3194","4781":"jugador4781",
                 "5261":"jugador5261","6193":"jugador6193","7419":"jugador7419","8539":"jugador8539" };

const NOMBRES_JUGADORES = {
  jugador1278:"WETHERBY", jugador2935:"BREWER", jugador3194:"CRANE",
  jugador4781:"NICHOLS", jugador5261:"PICKMAN", jugador6193:"RICE"
};
const nombreVisible = id => NOMBRES_JUGADORES[id] || id.toUpperCase();

/* ===================== UTILIDADES ===================== */
let jugadorActual = "", currentAccess = null;
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
function sonar(f){ try{ new Audio(f).play().catch(()=>{}); }catch(e){} }

function fetchConTimeout(url, ms = 12000){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
}
async function pedirJSON(url){
  const r = await fetchConTimeout(url);
  if(!r.ok) throw new Error("HTTP " + r.status);
  const txt = await r.text();
  try{ return JSON.parse(txt); }catch(e){ throw new Error("El servidor no devolvió un JSON válido."); }
}

function abrirModal(titulo, html){ $('modalTitle').innerText = titulo; $('modalDynamicBody').innerHTML = html; $('codeModal').style.display = 'flex'; }
function closeCodeModal(){ $('codeModal').style.display = 'none'; }
function mostrarErrorModal(msg){
  sonar('audio/nope.mp3');
  $('modalDynamicBody').innerHTML = `<p class="error-msg" style="font-size:1.05rem">${msg}</p>
    <div class="code-modal-buttons"><button class="code-modal-btn" onclick="closeCodeModal()">CERRAR</button></div>`;
}

/* ===================== IDENTIDAD ===================== */
function actualizarIdentidadJugador(){
  const url = new URLSearchParams(location.search).get('jugador');
  if(url && url.trim()){ jugadorActual = url.trim(); localStorage.setItem('jugador_activo_global', jugadorActual); }
  else jugadorActual = (localStorage.getItem('jugador_activo_global') || "").trim();
  if(!jugadorActual) jugadorActual = "jugadorXXXX";
  $('identidadTexto').innerText = `IDENTIDAD: ${nombreVisible(jugadorActual)}`;
  localStorage.setItem('jugador_nombre_real', nombreVisible(jugadorActual));
  Object.keys(locationConfigs).forEach(k => {          // iconos bajo cada hotspot
    const el = $('hotspot-' + k); if(!el) return;
    const b = document.createElement('span'); b.className = 'hotspot-badge';
    b.innerText = salasLibres.includes(k) ? ICONOS[k] : (locationConfigs[k].clave ? '🔒' : ICONOS[k]);
    el.appendChild(b);
  });
  registrarUbicacion('pasillo');
}
// La ubicación del jugador se guarda en Firebase: jugadores/<jugador>/ubicacion
let ubicacionActual = null;
function registrarUbicacion(sala){
  if(jugadorActual === "jugadorXXXX") return;
  ubicacionActual = sala;
  escribirUbicacionFirebase();
}
function escribirUbicacionFirebase(){
  if(!ubicacionActual || !jugadorActual || jugadorActual === "jugadorXXXX") return;
  if(typeof dbLogia === 'undefined') return;   // Firebase aún no está listo: se reintenta al crearlo
  const fichaRef = dbLogia.ref(`jugadores/${jugadorActual}`);
  // Solo se escribe si la ficha ya existe (así no se crea un jugador a medias).
  fichaRef.once('value').then(snap => {
    if(snap.exists()) return fichaRef.child('ubicacion').set(ubicacionActual);
  }).catch(err => console.error("Error al guardar la ubicación en Firebase:", err));
}

/* ===================== ENTRAR EN UNA SALA ===================== */
function goToRoom(roomKey, page){
  if(typeof salirDeLaLlamada === 'function') salirDeLaLlamada(false);
  registrarUbicacion(roomKey);
  sonar('audio/opendoor.mp3');
  setTimeout(() => { location.href = `${page}?jugador=${enc(jugadorActual)}`; }, 1600);
}

function checkRoomAccess(roomKey, page){
  sonar('audio/click.mp3');
  if(salasLibres.includes(roomKey)){ goToRoom(roomKey, page); return; }
  currentAccess = { roomKey, roomTitle: locationConfigs[roomKey].title, pageTarget: page };
  const guardado = (localStorage.getItem('jugador_activo_global') || "").trim();
  if(!guardado) abrirPeticionCap(currentAccess.roomTitle);
  else { jugadorActual = guardado; comprobarAcceso(); }
}

function abrirPeticionCap(titulo){
  abrirModal(`ACCESO: ${titulo.toUpperCase()}`, `
    <p>No hay identidad en memoria. Introduce tu CAP (código de acceso personal):</p>
    <input type="text" id="capInput" class="code-modal-input" maxlength="4" placeholder="----" autocomplete="off" spellcheck="false"
           onkeydown="if(event.key==='Enter')validarCap()">
    <span id="modalError" class="error-msg"></span>
    <div class="code-modal-buttons">
      <button class="code-modal-btn btn-si" onclick="validarCap()">COMPROBAR</button>
      <button class="code-modal-btn" onclick="closeCodeModal()">CANCELAR</button>
    </div>`);
  $('capInput').focus();
}
function validarCap(){
  const id = capMap[$('capInput').value.trim()];
  if(!id){ sonar('audio/nope.mp3'); $('modalError').innerText = "Código incorrecto."; return; }
  jugadorActual = id;
  localStorage.setItem('jugador_activo_global', id);
  localStorage.setItem('jugador_nombre_real', nombreVisible(id));
  $('identidadTexto').innerText = `IDENTIDAD: ${nombreVisible(id)}`;
  comprobarAcceso();
}

/* 1) ¿puede entrar? 2) ¿pide clave? 3) confirmar PA */
function comprobarAcceso(){
  const cfg = locationConfigs[currentAccess.roomKey];
  const coste = cfg.costesPA[jugadorActual];
  if(coste === undefined || coste === "denegado"){ abrirModal(`ACCESO: ${cfg.title.toUpperCase()}`, ''); mostrarErrorModal("Lo siento. No puedes acceder a este sitio."); return; }
  if(!cfg.clave){ mostrarConfirmacionPA(coste); return; }
  if(puertasAbiertas[currentAccess.roomKey]){ mostrarConfirmacionPA(coste); return; }   // el máster la ha abierto
  pedirClave(cfg);
}

/* ---------- Pop-up de contraseña de 4 cifras ---------- */
function pedirClave(cfg){
  abrirModal(cfg.title.toUpperCase(), `
    <div class="sello">🔒</div>
    <p>Una puerta sellada con cuatro sigilos. Solo quien conozca la combinación podrá cruzarla.</p>
    <div class="digitos" id="digitos">
      ${[0,1,2,3].map(i => `<input class="digito" inputmode="numeric" maxlength="1" autocomplete="off" data-i="${i}">`).join('')}
    </div>
    <span id="modalError" class="error-msg"></span>
    <div class="code-modal-buttons">
      <button class="code-modal-btn btn-rojo" onclick="validarClave()">ABRIR</button>
      <button class="code-modal-btn" onclick="closeCodeModal()">CANCELAR</button>
    </div>`);
  const cajas = [...document.querySelectorAll('.digito')];
  cajas.forEach((c, i) => {
    c.addEventListener('input', () => { c.value = c.value.replace(/\D/g, '').slice(-1); $('digitos').classList.remove('error'); if(c.value && cajas[i+1]) cajas[i+1].focus(); });
    c.addEventListener('keydown', e => {
      if(e.key === 'Backspace' && !c.value && cajas[i-1]) cajas[i-1].focus();
      if(e.key === 'Enter') validarClave();
    });
    c.addEventListener('paste', e => {
      const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if(!t) return; e.preventDefault();
      cajas.forEach((x, k) => x.value = t[k] || ''); (cajas[Math.min(t.length, 3)]).focus();
    });
  });
  cajas[0].focus();
}
function validarClave(){
  const cfg = locationConfigs[currentAccess.roomKey];
  if(puertasAbiertas[currentAccess.roomKey]){ sonar('audio/correct.mp3'); mostrarConfirmacionPA(cfg.costesPA[jugadorActual]); return; }
  const intento = [...document.querySelectorAll('.digito')].map(c => c.value).join('');
  if(intento === cfg.clave){ sonar('audio/correct.mp3'); mostrarConfirmacionPA(cfg.costesPA[jugadorActual]); return; }
  sonar('audio/nope.mp3');
  const d = $('digitos'); d.classList.remove('error'); void d.offsetWidth; d.classList.add('error');
  $('modalError').innerText = intento.length < 4 ? "Faltan cifras por introducir." : "Los sigilos permanecen cerrados. Combinación incorrecta.";
  if(intento.length === 4){ document.querySelectorAll('.digito').forEach(c => c.value = ''); document.querySelector('.digito').focus(); }
}

/* ---------- Confirmación y cobro de Puntos de Acción ---------- */
function mostrarConfirmacionPA(coste){
  abrirModal(`ACCESO: ${currentAccess.roomTitle.toUpperCase()}`, `
    <p>¿Quieres gastar ${coste} Punto${coste === 1 ? '' : 's'} de Acción para entrar en ${currentAccess.roomTitle}?</p>
    <div class="code-modal-buttons">
      <button class="code-modal-btn btn-si" onclick="confirmarAcceso(${coste})">SÍ</button>
      <button class="code-modal-btn btn-no" onclick="closeCodeModal()">NO</button>
    </div>`);
}
function confirmarAcceso(coste){
  $('modalDynamicBody').innerHTML = `<p>Comprobando Puntos de Acción de ${nombreVisible(jugadorActual)}...</p>`;
  // Los PA se leen y se descuentan en Firebase (jugadores/<jugador>/puntos_accion).
  const ref = dbLogia.ref(`jugadores/${jugadorActual}/puntos_accion`);
  ref.once('value').then(snap => {
    const pa = Number(snap.val()) || 0;
    if(pa < coste){ mostrarErrorModal("Lo siento, no tienes Puntos de Acción suficientes."); return; }
    // Transacción: descuenta el coste de forma segura aunque el máster lo cambie a la vez.
    return ref.transaction(actual => {
      if(actual === null) return pa - coste;          // primera pasada (sin caché): el servidor la corrige
      const saldo = Number(actual) || 0;
      if(saldo < coste) return;                       // sin PA suficientes: se cancela
      return saldo - coste;
    }).then(res => {
      if(!res.committed) mostrarErrorModal("Lo siento, no tienes Puntos de Acción suficientes.");
      else { closeCodeModal(); goToRoom(currentAccess.roomKey, currentAccess.pageTarget); }
    });
  }).catch(err => {
    console.error("Error al descontar PA en Firebase:", err);
    mostrarErrorModal("Error de conexión con el servidor.");
  });
}

/* ===================== CAP OBLIGATORIO SI NO HAY JUGADOR ===================== */
// Si al cargar la página no hay jugador actual (ni en la URL ni guardado en el navegador),
// se pide el CAP en un pop-up SIN botón de cancelar, para que el jugador quede siempre definido.
// Si ya hay jugador, no se pregunta nada.
function hayJugadorActual(){
  const j = (jugadorActual || "").trim();
  // "jugadorXXXX" es el marcador de esta página y "JUGADOR" el de las salas: ninguno es un jugador real.
  return !!j && j !== "jugadorXXXX" && j.toUpperCase() !== "JUGADOR";
}
function pedirCapSiNoHayJugador(){
  if(hayJugadorActual()) return;
  abrirModal("IDENTIFICACIÓN", `
    <p>No hay identidad en memoria. Introduce tu CAP (código de acceso personal):</p>
    <input type="text" id="capInicialInput" class="code-modal-input" maxlength="4" placeholder="----" autocomplete="off" spellcheck="false"
           onkeydown="if(event.key==='Enter')validarCapInicial()">
    <span id="capInicialError" class="error-msg"></span>
    <div class="code-modal-buttons">
      <button class="code-modal-btn btn-si" onclick="validarCapInicial()">COMPROBAR</button>
    </div>`);
  $('capInicialInput').focus();
}
function validarCapInicial(){
  const id = capMap[$('capInicialInput').value.trim()];
  if(!id){ sonar('audio/nope.mp3'); $('capInicialError').innerText = "Código incorrecto."; return; }
  jugadorActual = id;
  localStorage.setItem('jugador_activo_global', id);
  localStorage.setItem('jugador_nombre_real', nombreVisible(id));
  // Se recarga la página (sin ?jugador= en la URL) para que todo arranque ya con el jugador definido:
  // nombre en las cámaras, ubicación en Firebase, etc.
  const u = new URL(location.href);
  u.searchParams.delete('jugador');
  location.replace(u.toString());
}

actualizarIdentidadJugador();
pedirCapSiNoHayJugador();
