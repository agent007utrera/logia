<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observatorio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">

<style>
:root {
    --negro:        #040806;
    --bosque:       #0a1510;
    --musgo:        #12261b;
    --esmeralda:    #2f7d57;
    --verdin:       #5fb98a;
    --brillo:       #9bf0c0;
    --laton:        #b49a55;
    --laton-osc:    #6e5c2e;
    --pergamino:    #d9d3b3;
    --pergamino-osc:#a9a285;
    --sangre:       #a8423a;
    --fuente-titulo: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    --fuente-sub:    'Cinzel', Georgia, serif;
    --fuente-cuerpo: 'IM Fell English', Georgia, 'Times New Roman', serif;
    --fuente-maquina:'Special Elite', 'Courier New', monospace;

    --ratio-w: 16;
    --ratio-h: 9;
}

body, html {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background-color: var(--negro);
    background-image: radial-gradient(circle at 50% 40%, #0f2318 0%, #050a07 75%);
    font-family: var(--fuente-cuerpo);
    color: var(--pergamino);
}
* { box-sizing: border-box; }

body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 4999;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
}
body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5000;
    opacity: 0.09;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.layout-container {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 8px;
    padding: 8px;
    width: 100%;
    height: 100%;
}

.room-section {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-color: #000;
    border: 2px solid var(--laton-osc);
    box-shadow: inset 0 0 0 3px #000, inset 0 0 0 4px var(--laton-osc), 0 0 30px rgba(47,125,87,0.18);
    border-radius: 3px;
    overflow: hidden;
}

.game-container {
    position: relative;
    width: min(100%, calc((100vh - 28px) * var(--ratio-w) / var(--ratio-h)));
    aspect-ratio: var(--ratio-w) / var(--ratio-h);
    background: linear-gradient(135deg, #0c1a13 0%, #07110c 60%, #0c1a13 100%);
}
.game-image {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    object-fit: cover;
}

.hotspot {
    position: absolute;
    background-color: transparent;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s, box-shadow 0.3s;
}
.hotspot:hover {
    background-color: rgba(95, 185, 138, 0.38);
    box-shadow: inset 0 0 22px rgba(155, 240, 192, 0.85);
}

#hsAtlas {
    top: 80%;
    left: 52%;
    width: 18%;
    height: 20%;
    clip-path: polygon(0% 67%, 34% 0%, 100% 15%, 90% 100%);
}

#hsCuaderno {
    top: 83%;
    left: 70%;
    width: 11%;
    height: 15%;
    clip-path: polygon(0% 0%, 78% 8%, 100% 100%, 16% 90%);
}

#hsVentanal {
    top: 14%;
    left: 7%;
    width: 37%;
    height: 63%;
    clip-path: polygon(7% 100%, 19% 97%, 29% 94%, 46% 89%, 60% 85%, 72% 83%, 83% 81%, 93% 79%, 97% 77%, 99% 68%, 99% 64%, 100% 57%, 99% 50%, 99% 45%, 97% 40%, 95% 31%, 94% 23%, 92% 19%, 85% 14%, 81% 12%, 78% 8%, 73% 6%, 69% 4%, 63% 1%, 61% 0%, 55% 0%, 47% 1%, 41% 1%, 35% 3%, 34% 3%, 31% 6%, 30% 10%, 28% 15%, 25% 22%, 25% 25%, 22% 33%, 21% 39%, 19% 45%, 18% 50%, 16% 54%, 11% 65%, 9% 70%, 6% 75%, 4% 80%, 2% 83%, 2% 84%, 0% 85%, 4% 93%);
}

#hsLentes {
    top: 81%;
    left: 0%;
    width: 23%;
    height: 19%;
    clip-path: polygon(1% 98%, 0% 25%, 19% 0%, 53% 12%, 55% 43%, 84% 38%, 86% 50%, 100% 48%, 83% 100%);
}

#hsTelescopio {
    top: 39%;
    left: 27%;
    width: 19%;
    height: 19%;
    clip-path: polygon(0% 23%, 9% 0%, 63% 41%, 71% 36%, 92% 55%, 94% 71%, 100% 84%, 95% 100%, 70% 82%, 59% 76%);
}

#hsCofre {
    top: 64%;
    left: 44%;
    width: 12%;
    height: 25%;
    clip-path: polygon(20% 6%, 82% 0%, 86% 31%, 100% 51%, 100% 58%, 80% 56%, 16% 100%, 0% 89%, 12% 60%, 19% 50%);
}

#hsButacon {
    top: 49%;
    left: 55%;
    width: 16%;
    height: 33%;
    clip-path: polygon(7% 10%, 22% 3%, 38% 1%, 54% 0%, 71% 0%, 83% 5%, 98% 9%, 99% 23%, 96% 42%, 94% 49%, 99% 57%, 100% 69%, 97% 78%, 94% 91%, 94% 100%, 4% 89%, 5% 73%, 2% 63%, 0% 55%, 7% 44%, 10% 39%, 11% 29%);
}

#hsHornacina {
    top: 30%;
    left: 55%;
    width: 14%;
    height: 23%;
    clip-path: polygon(1% 100%, 17% 94%, 27% 90%, 40% 88%, 50% 86%, 64% 85%, 75% 87%, 86% 91%, 100% 94%, 97% 36%, 96% 27%, 92% 24%, 86% 15%, 84% 12%, 79% 8%, 74% 5%, 64% 1%, 62% 0%, 55% 0%, 44% 0%, 37% 1%, 29% 4%, 25% 8%, 20% 11%, 17% 15%, 11% 22%, 7% 28%, 4% 38%, 0% 45%);
}

#hsEscalera {
    top: 21%;
    left: 77%;
    width: 22%;
    height: 58%;
    clip-path: polygon(1% 6%, 59% 0%, 60% 20%, 100% 36%, 91% 86%, 79% 87%, 74% 89%, 70% 92%, 67% 97%, 63% 99%, 62% 100%, 57% 100%, 50% 97%, 47% 95%, 44% 94%, 44% 59%, 38% 52%, 22% 47%, 11% 40%, 4% 35%, 0% 32%);
}

#hsLampara {
    top: 76%;
    left: 84%;
    width: 7%;
    height: 24%;
    clip-path: polygon(23% 1%, 50% 0%, 66% 5%, 67% 20%, 71% 29%, 78% 44%, 79% 60%, 72% 65%, 66% 71%, 78% 76%, 95% 78%, 100% 87%, 90% 97%, 79% 99%, 44% 100%, 33% 97%, 12% 94%, 5% 89%, 0% 80%, 11% 72%, 17% 69%, 11% 59%, 6% 46%, 9% 27%, 11% 24%, 18% 14%);
}

#hsGlobo {
    top: 71%;
    left: 91%;
    width: 9%;
    height: 29%;
    clip-path: polygon(0% 31%, 10% 24%, 29% 12%, 49% 6%, 82% 0%, 82% 0%, 100% 2%, 99% 100%, 11% 91%, 5% 78%, 2% 69%, 2% 59%, 7% 47%);
}


.player-hud {
    position: fixed; top: 15px; right: 20px;
    background: rgba(5, 12, 8, 0.94);
    border: 1px solid var(--laton);
    outline: 1px solid var(--laton-osc); outline-offset: 2px;
    color: var(--verdin); padding: 8px 16px;
    font-family: var(--fuente-maquina); font-size: 0.9rem;
    letter-spacing: 2px; z-index: 1500;
    box-shadow: 0 0 14px rgba(47, 125, 87, 0.45); text-align: center;
}

#timerContainer {
    position: fixed; top: 15px; left: 15px;
    background: linear-gradient(135deg, #0a1510 0%, #12261b 100%);
    color: var(--brillo); border: 1px solid var(--laton);
    outline: 1px solid var(--laton-osc); outline-offset: 2px;
    box-shadow: inset 0 0 10px rgba(95,185,138,0.2), 0 0 12px rgba(47,125,87,0.35);
    padding: 8px 14px; font-family: var(--fuente-maquina);
    font-size: 0.95rem; letter-spacing: 2px; z-index: 1500;
}

.back-btn {
    display: none; position: fixed; top: 15px; left: 15px;
    background: var(--musgo); color: var(--brillo);
    border: 1px solid var(--laton); outline: 1px solid var(--laton-osc); outline-offset: 2px;
    padding: 8px 14px; font-family: var(--fuente-sub); font-size: 0.8rem;
    letter-spacing: 2px; text-decoration: none; z-index: 1500;
}

.video-sidebar {
    background: rgba(4, 9, 6, 0.96);
    border: 2px solid var(--laton-osc);
    box-shadow: inset 0 0 0 3px #000, inset 0 0 0 4px var(--laton-osc), 0 0 15px rgba(0,0,0,0.8);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: var(--fuente-maquina); border-radius: 3px;
}
.video-header {
    padding: 12px 10px; background: linear-gradient(180deg, #0f2318, #08120d);
    border-bottom: 1px solid var(--laton-osc); color: var(--laton);
    font-family: var(--fuente-sub); font-size: 0.85rem; text-align: center; letter-spacing: 3px;
}
#video-grid { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 10px; }
.video-card { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border: 1px solid var(--laton-osc); overflow: hidden; }
.video-card video { width: 100%; height: 100%; object-fit: cover; }
.video-name {
    position: absolute;
    left: 5px; bottom: 5px;
    max-width: calc(100% - 10px);
    padding: 2px 7px;
    background: rgba(4, 9, 6, 0.88);
    color: var(--brillo);
    font-size: 0.68rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid rgba(180, 154, 85, 0.5);
}
.aforo-aviso {
    color: var(--laton); font-family: var(--fuente-sub); font-size: 0.72rem; letter-spacing: 3px;
    text-align: center; margin: 0; padding: 6px; border-top: 1px solid var(--laton-osc);
    background: #060d09; display: flex; align-items: center; justify-content: space-between;
}
.aforo-aviso button { background: var(--musgo); border: 1px solid var(--laton-osc); color: var(--brillo); padding: 2px 8px; cursor: pointer; }
.aforo-aviso button { position: relative; overflow: hidden; }
.aforo-aviso button.off { background: #2a0e0b; border-color: var(--sangre); color: var(--sangre); }
.aforo-aviso button.off::after {   /* tachón diagonal cuando está apagado */
    content: ""; position: absolute; top: 50%; left: -20%;
    width: 140%; height: 2px; background: var(--sangre);
    transform: translateY(-50%) rotate(-45deg); pointer-events: none;
}

.modal {
    display: none; position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(6,16,10,0.82), rgba(0,0,0,0.92));
    backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center;
}
.modal-content {
    position: relative; width: 90%; max-width: 470px; max-height: 82vh; overflow-y: auto;
    padding: 30px; background: linear-gradient(180deg, #14291d 0%, #0b1710 100%);
    border: 2px solid var(--laton); box-shadow: 0 0 0 4px #000, 0 0 0 5px var(--laton-osc), 0 10px 40px rgba(0,0,0,0.9);
}
.modal-content h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 1.3rem; text-align: center; color: var(--verdin); }
.modal-content p { line-height: 1.65; color: var(--pergamino); text-align: center; }
.close-btn { position: absolute; top: 12px; right: 18px; font-size: 1.7rem; color: var(--laton); background: none; border: none; cursor: pointer; }

.drawer-img { display: block; margin: 14px auto 6px; width: 70%; max-height: 180px; object-fit: contain; border: 1px solid var(--laton); cursor: zoom-in; }
.fila-botones { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
.drawer-btn { background: #1c3d2b; color: var(--brillo); border: 1px solid var(--laton); padding: 9px 20px; font-family: var(--fuente-sub); cursor: pointer; }
.drawer-btn.no { background: #3a1613; border-color: var(--sangre); color: #e9a29b; }
.cost-box { margin: 14px 0 4px; padding: 9px; border: 1px dashed var(--laton-osc); background: rgba(47,125,87,0.1); text-align: center; color: var(--brillo); font-family: var(--fuente-maquina); }

#fullscreenViewer { display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.96); z-index: 3000; justify-content: center; align-items: center; }
#fullscreenViewer img { max-width: 92%; max-height: 92%; object-fit: contain; border: 1px solid var(--laton-osc); }
/* SUSTO: el vídeo cubre SOLO la pantalla de juego (no la columna de webcams) */
#sustoOverlay { display: none; position: absolute; inset: 0; z-index: 50; background: #000; }
#sustoOverlay video { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Mientras suena el susto se ocultan HUD y botón de volver, para que no se pueda escapar */
body.susto-activo .player-hud, body.susto-activo .back-btn, body.susto-activo #timerContainer { visibility: hidden; }
</style>
</head>

<body>

<div class="player-hud" id="playerHud">
    <div id="identidadTexto">IDENTIDAD: CARGANDO...</div>
    <div id="video-status-hud" style="font-size:0.7rem;color:var(--pergamino-osc);margin-top:4px;letter-spacing:1px;">Conectando...</div>
</div>

<div id="timerContainer">PUERTA CERRADA: <span id="countdown">00:10</span></div>
<a href="#" id="backBtn" class="back-btn" onclick="playClick(); volverAlMapa(event)">IR AL PASILLO</a>

<div class="layout-container">
    <div class="room-section">
    <div class="game-container" id="gameContainer">
        <video src="images/sala_observatorio.mp4" class="game-image" autoplay muted loop playsinline preload="auto" aria-label="Observatorio de la Logia"></video>

        <!-- HOTSPOTS (los marcados como OBJETO RECOGIBLE dan un objeto; el resto solo describen) -->
        <!-- Ventanal · SUSTO: vídeo del cuervo a pantalla de juego + resta 2 de cordura -->
        <div class="hotspot" id="hsVentanal" data-etiqueta="Ventanal" onclick="playClick(); accionSusto('ventanal')"></div>

        <!-- Telescopio -->
        <div class="hotspot" id="hsTelescopio" data-etiqueta="Telescopio" onclick="playClick(); abrirInfo('El telescopio', 'El telescopio de latón apunta a un punto del cielo donde no hay estrella alguna, sino una ausencia: un hueco circular, perfectamente negro, rodeado de un halo apenas verdoso. Acercáis el ojo y el vacío parece acercarse a vosotros. Por un instante creéis ver, en lo más hondo del tubo, un movimiento lento y vasto, y una gravedad que os arrastra hacia delante. Cuando os retiráis, la lente está empañada por dentro.')"></div>

        <!-- Butacón verde · OBJETO RECOGIBLE: Taza de café -->
        <div class="hotspot" id="hsButacon" data-etiqueta="Butacón verde" onclick="playClick(); accionRecoger('cafe')"></div>

        <!-- Hornacina vacía -->
        <div class="hotspot" id="hsHornacina" data-etiqueta="Hornacina vacía" onclick="playClick(); abrirInfo('La hornacina', 'En el muro, una hornacina de arco ciego, honda y vacía. Ninguna imagen la ocupa, pero el enlucido guarda las marcas de que durante mucho tiempo hubo algo allí: cuatro hendiduras, de garras o de dedos, hundidas en la piedra, y una mancha circular, más oscura, a la altura de la cabeza de un hombre. Del fondo sopla un hálito tibio y rítmico, como una respiración, y cuanto más se escucha más se parece a un nombre murmurado.')"></div>

        <!-- Cofre de instrumentos -->
        <div class="hotspot" id="hsCofre" data-etiqueta="Cofre de instrumentos" onclick="playClick(); abrirInfo('El cofre de instrumentos', 'Un cofre de madera, entreabierto, con un mapa estelar clavado en la tapa. Dentro, entre fieltros, reposan instrumentos de medida cuya función no alcanzáis a adivinar: compases de ángulos imposibles, un disco de cristal ahumado, una brújula cuya aguja, lejos de señalar el norte, gira lentamente hacia la hornacina. Todo está dispuesto con orden maniático, como el equipaje de quien espera partir en cualquier momento hacia un lugar de donde no se vuelve.')"></div>

        <!-- Atlas estelar · OBJETO RECOGIBLE: Página del Necronomicón (Prueba E) -->
        <div class="hotspot" id="hsAtlas" data-etiqueta="Atlas estelar" onclick="playClick(); accionRecoger('prueba_e_pagina')"></div>

        <!-- Cuaderno de cuero · OBJETO RECOGIBLE: Pitillera -->
        <div class="hotspot" id="hsCuaderno" data-etiqueta="Cuaderno de cuero" onclick="playClick(); accionRecoger('pitillera')"></div>

        <!-- Lámpara de aceite -->
        <div class="hotspot" id="hsLampara" data-etiqueta="Lámpara de aceite" onclick="playClick(); abrirInfo('La lámpara de aceite', 'La lámpara arde con una llama baja. Su luz no se reparte por el suelo sino que se encoge, como si temiera extenderse, y las sombras de los muebles se estiran hacia ella en lugar de alejarse. El cristal está tibio y cubierto de un hollín fino.')"></div>

        <!-- Globo celeste -->
        <div class="hotspot" id="hsGlobo" data-etiqueta="Globo celeste" onclick="playClick(); abrirInfo('El globo celeste', 'El globo celeste gira apenas, sin que nadie lo toque, con un chirrido de eje que recuerda un lamento. Sobre la superficie pintada aparecen las constelaciones, y entre ellas un espacio en blanco, sin nombre, justo en el lugar que señala el telescopio.')"></div>

        <!-- Escalera de caracol -->
        <div class="hotspot" id="hsEscalera" data-etiqueta="Escalera de caracol" onclick="playClick(); abrirInfo('La escalera de caracol', 'Una escalera de caracol, de hierro negro, asciende hacia una oscuridad que no es la de la torre. Los peldaños, estrechos y desiguales, parecen demasiado numerosos para la altura del edificio, y en lo alto, donde debería haber un tejado, se adivina un resplandor tenue y frío, como de una luna que no es la nuestra.')"></div>

        <!-- Arcón de lentes -->
        <div class="hotspot" id="hsLentes" data-etiqueta="Arcón de lentes" onclick="playClick(); abrirInfo('El arcón de lentes', 'Un arcón con lentes, lupas y anteojos de latón, pulcramente dispuestos. Todos los cristales, sin excepción, están empañados por dentro, como si hubieran mirado algo que dejó en ellos su aliento.')"></div>

        <!-- CAPA DEL SUSTO (vídeo a pantalla de juego completa) -->
        <div id="sustoOverlay"><video id="sustoVideo" src="" playsinline></video></div>
    </div>
    </div>

    <aside class="video-sidebar">
        <div class="video-header"><span id="video-status">Conectando...</span></div>
        <div id="video-grid"></div>
        <p class="aforo-aviso">
            <button id="btnMic" onclick="toggleMicrofono()">🎤</button>
            OBSERVATORIO
            <button id="btnCam" onclick="toggleCamara()">📷</button>
        </p>
    </aside>
</div>

<div id="gameModal" class="modal">
    <div class="modal-content" id="modalContent">
        <button class="close-btn" onclick="playClick(); closeModal()">&times;</button>
        <h3 id="modalTitle">Título</h3>
        <div id="modalBody"><p id="modalText">Texto...</p></div>
    </div>
</div>

<div id="fullscreenViewer" onclick="playClick(); closeFullscreen()">
    <img id="fullscreenImg" src="" alt="Pantalla completa" style="display:none;">
</div>

// SUSTOS   →   accionSusto('clave')
// ---------------------------------------------------------------------
// Vídeo a pantalla completa que NO se puede cerrar mientras suena. Al acabar,
// resta cordura en Firebase (jugadores/<jugador>/cordura). Cada jugador lo ve

//   video        → vídeo del susto (con sonido); sale sobre la pantalla de juego, no sobre las webcams.
//   cordura      → cuánta cordura pierde.

//   textoTras    → mensaje tras el susto (se añade " N de cordura.").

const AUDIO_CLICK = "audio/click.mp3";
const AUDIO_CLING = "audio/cling.mp3";
const AUDIO_NOPE = "audio/nope.mp3";
const AUDIO_PICKUP = "audio/pickup.mp3";
const AUDIO_PUERTA = "audio/opendoor.mp3";

let jugadorActual = "JUGADOR";

function nombreVisible(id) { return NOMBRES_JUGADORES[id] || id.toUpperCase(); }

function actualizarIdentidadJugador() {
    const urlParams = new URLSearchParams(window.location.search);
    const jugadorUrl = urlParams.get('jugador');
    if (jugadorUrl) {
        jugadorActual = jugadorUrl.trim();
        localStorage.setItem('jugador_activo_global', jugadorActual);
    } else {
        jugadorActual = localStorage.getItem('jugador_activo_global') || "JUGADOR";
    }
    document.getElementById('identidadTexto').innerText = `IDENTIDAD: ${nombreVisible(jugadorActual)}`;
    localStorage.setItem('jugador_nombre_real', nombreVisible(jugadorActual));
    registrarUbicacion('observatorio');
}

let ubicacionActual = '';
function registrarUbicacion(sala) {
    if (jugadorActual === "JUGADOR") return;
    ubicacionActual = sala;
    escribirUbicacionFirebase();
}
function escribirUbicacionFirebase() {
    if (!ubicacionActual || jugadorActual === "JUGADOR") return;
    if (typeof firebase === 'undefined' || !firebase.apps.length) return; // aún no está listo
    const fichaRef = firebase.database().ref('jugadores/' + jugadorActual);
    fichaRef.once('value').then(snap => {
        if (snap.exists()) return fichaRef.child('ubicacion').set(ubicacionActual);
    }).catch(err => console.error('Error al guardar la ubicación en Firebase:', err));
}

function sonar(archivo) {
    if (!archivo) return;
    new Audio(archivo).play().catch(e => {});
}
function playClick() { sonar(AUDIO_CLICK); }
function sonarNope() { sonar(AUDIO_NOPE); }

// =====================================================================
// JUGADOR MUERTO (vida 0 en Firebase: jugadores/<id>/vida)
// Un jugador muerto no puede coger objetos ni hacer nada con ellos. Solo puede mirar.
// =====================================================================
let vidaJugador = null;   // se mantiene al día en tiempo real (ver listener tras initializeApp)
function estoyMuerto() {
    if (vidaJugador === null || vidaJugador === undefined || vidaJugador === '') return false;
    const n = Number(vidaJugador);
    return isFinite(n) && n <= 0;
}
// Devuelve true (y avisa) si el jugador está muerto: la acción debe cancelarse.
function bloquearSiMuerto() {
    if (!estoyMuerto()) return false;
    sonar('audio/muerto.mp3');
    openModal("Has muerto", `<p style="color:var(--sangre)">Lo siento. Estás muerto. No puedes hacer nada.</p>${btnCerrar()}`);
    return true;
}





// =====================================================================
// CUENTA ATRÁS DE LA PUERTA AL ENTRAR EN LA SALA
// ---------------------------------------------------------------------
// USAR_CUENTA_ATRAS = true  -> cuenta atrás normal: 10 s con el cartel
//                              "PUERTA CERRADA", suena cling.mp3 al final
//                              y entonces aparece VOLVER AL PASILLO.
// USAR_CUENTA_ATRAS = false -> SIN cuenta atrás: el botón VOLVER AL PASILLO
//                              aparece al instante, sin sonido de cling.
// Para volver a activarla en el futuro, cambia false por true.
// =====================================================================
const USAR_CUENTA_ATRAS = false;

// Segundos que dura la cuenta atrás (solo se usa si USAR_CUENTA_ATRAS = true).
let timeLeft = 10;

const countdownEl = document.getElementById('countdown');
const timerContainerEl = document.getElementById('timerContainer');
const backBtnEl = document.getElementById('backBtn');

if (USAR_CUENTA_ATRAS) {
    // ---- MODO CON CUENTA ATRÁS (el comportamiento original) ----
    const timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) countdownEl.innerText = "00:" + (timeLeft < 10 ? "0" : "") + timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            sonar(AUDIO_CLING);                       // mp3 del final de la cuenta atrás
            timerContainerEl.style.display = 'none';  // oculta el cartel "PUERTA CERRADA"
            backBtnEl.style.display = 'block';        // muestra VOLVER AL PASILLO
        }
    }, 1000);
} else {
    // ---- MODO SIN CUENTA ATRÁS ----
    // No hay intervalo ni sonido de cling: se oculta el cartel y
    // se muestra directamente el botón VOLVER AL PASILLO.
    timerContainerEl.style.display = 'none';
    backBtnEl.style.display = 'block';
}





function volverAlMapa(event) {
    event.preventDefault();
    if (typeof salirDeLaLlamada === 'function') salirDeLaLlamada(false);
    sonar(AUDIO_PUERTA);
    setTimeout(() => { window.location.href = `mapa_582.html?jugador=${encodeURIComponent(jugadorActual)}`; }, 1600);
}

function openModal(titulo, html) {
    document.getElementById('modalTitle').innerText = titulo;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('gameModal').style.display = 'flex';
}
let audioInfo = null;
function pararAudioInfo() {
    if (audioInfo) { audioInfo.pause(); audioInfo = null; }
}
function closeModal() {
    pararAudioInfo();
    document.getElementById('gameModal').style.display = 'none';
}
function btnCerrar(t) { return `<div class="fila-botones"><button class="drawer-btn" onclick="playClick(); closeModal()">${t || 'Cerrar'}</button></div>`; }
function abrirInfo(t, txt, audio) {
    pararAudioInfo();   // por si había otro sonando
    openModal(t, `<p>${txt}</p>${btnCerrar()}`);
    if (audio) { audioInfo = new Audio(audio); audioInfo.play().catch(e => {}); }
}

function showFullscreenImage(src) {
    const viewer = document.getElementById('fullscreenViewer');
    const img = document.getElementById('fullscreenImg');

    img.src = src;
    viewer.style.display = 'flex';

// =====================================================================
// COSTE DE PA POR JUGADOR  +  "DENEGADO"
// ---------------------------------------------------------------------
// Cada objeto tiene una tabla "costes" con lo que paga CADA jugador:
//   · un número  → Puntos de Acción que le cuesta cogerlo a ESE jugador
//   · "denegado" → ese jugador no puede cogerlo
//   · jugador que no aparezca en la tabla → también denegado
// Si el objeto ya se lo llevaron, o el jugador está denegado, NO se avisa de nada:
// se muestra la descripción normal del hotspot (cfg.info), igual que si no hubiese objeto.
// =====================================================================
function costeDe(tabla) {
    const c = tabla ? tabla[jugadorActual] : undefined;
    if (c === undefined || c === "denegado") return null;
    const n = Number(c);
    return (isFinite(n) && n >= 0) ? n : null;
}

// Descripción normal del hotspot (la de siempre): se usa cuando no hay objeto que coger.
function mostrarDescripcion(cfg) {
    abrirInfo(cfg.info.titulo, cfg.info.texto);
}

let recogidaActual = null;

function accionRecoger(clave) {
    if (bloquearSiMuerto()) return;
    const cfg = OBJETOS[clave];

    // Jugador denegado: ve solo la descripción del hotspot, sin pistas de que hay un objeto.
    if (costeDe(cfg.costes) === null) { mostrarDescripcion(cfg); return; }

    openModal(cfg.info.titulo, `<p style="color:var(--verdin)">Examinando...</p>`);

    // Consulta en la base de datos correcta (logia-rol-vivo)
    firebase.database().ref('localizaciones/' + SALA_ID + '/' + cfg.item).once('value')
        .then(snapshot => {
            const datos = snapshot.val();
            if (datos && datos.disponible === false) {   // ya se lo han llevado
                mostrarDescripcion(cfg);
                return;
            }

            const coste = costeDe(cfg.costes);
            recogidaActual = cfg;
            openModal(cfg.titulo, `
                <p>${cfg.descripcion}</p>
                <img src="${cfg.imagen}" alt="${cfg.nombre}" class="drawer-img" onclick="playClick(); showFullscreenImage('${cfg.imagen}')">
                <div class="cost-box">¿Deseas coger «${cfg.nombre}»?<br>Coste: ${coste} Punto de Acción</div>
                <div class="fila-botones">
                    <button class="drawer-btn" onclick="playClick(); procesarRecogidaFirebase('${cfg.item}')">Sí, coger</button>
                    <button class="drawer-btn no" onclick="playClick(); closeModal()">No, dejar</button>
                </div>
            `);
        })
        .catch(err => {
            console.error("Error leyendo Firebase:", err);
            openModal("Error", `<p style="color:var(--sangre)">No se pudo conectar con Firebase.</p>${btnCerrar()}`);
        });
}

function procesarRecogidaFirebase(itemKey) {
    if (bloquearSiMuerto()) return;
    const cfg = OBJETOS[itemKey];
    const coste = costeDe(cfg.costes);
    if (coste === null) { mostrarDescripcion(cfg); return; }   // por seguridad (denegado)
    openModal(cfg.titulo, `<p style="color:var(--verdin)">Guardando objeto en tu inventario...</p>`);

    // Los Puntos de Acción se cobran en Firebase (jugadores/<jugador>/puntos_accion).
    const refPA = firebase.database().ref('jugadores/' + jugadorActual + '/puntos_accion');
    const devolverPA = () => refPA.transaction(a => (Number(a) || 0) + coste);

    refPA.once('value')
        .then(snap => {
            const pa = Number(snap.val()) || 0;
            if (pa < coste) return { sinPA: true };
            return refPA.transaction(actual => {
                if (actual === null) return pa - coste;       // primera pasada (sin caché): el servidor la corrige
                const saldo = Number(actual) || 0;
                if (saldo < coste) return;                    // sin PA suficientes: se cancela
                return saldo - coste;
            }).then(res => ({ sinPA: !res.committed }));
        })
        .then(cobro => {
            if (cobro.sinPA) {
                sonarNope();
                openModal(cfg.titulo, `<p style="color:var(--sangre)">No tienes suficientes Puntos de Acción.</p>${btnCerrar()}`);
                return;
            }

            // PA ya cobrados en Firebase: en una sola escritura atómica el objeto pasa al inventario
            // del jugador (inventarios/<jugador>/<objeto> = true, lo que ve inventario.html) y queda
            // marcado como cogido en la sala (localizaciones/<SALA_ID>/<objeto>/disponible = false).
            const actualizacion = {};
            actualizacion['inventarios/' + jugadorActual + '/' + cfg.item] = true;
            actualizacion['localizaciones/' + SALA_ID + '/' + cfg.item + '/disponible'] = false;

            return firebase.database().ref().update(actualizacion)
                .then(() => {
                    sonar(AUDIO_PICKUP);
                    openModal(cfg.titulo, `<p style="color:var(--brillo)">${cfg.textoExito}</p>${btnCerrar('Continuar')}`);
                })
                .catch(err => { devolverPA(); throw err; }); // si no se guarda, se devuelven los PA
        })
        .catch(err => {
            console.error("Error de red:", err);
            openModal("Error", `<p style="color:var(--sangre)">Error de conexión con el servidor.</p>${btnCerrar()}`);
        });
}

// =====================================================================
// SUSTO: vídeo a pantalla completa + resta de cordura
// =====================================================================
const sustosVistos = {};   // qué sustos ya ha visto este jugador en esta visita

// Resta 'cantidad' a una estadística del jugador (nunca baja de 0). Devuelve { nuevo }.
async function restarEstadistica(campo, cantidad) {
    if (!jugadorActual || jugadorActual === "JUGADOR") throw new Error("Jugador no identificado.");
    cantidad = Number(cantidad) || 0;
    const ref = firebase.database().ref('jugadores/' + jugadorActual + '/' + campo);
    const saldoLeido = Number((await ref.once('value')).val()) || 0;
    const res = await ref.transaction(actual => {
        const saldo = (actual === null) ? saldoLeido : (Number(actual) || 0);
        return Math.max(0, saldo - cantidad);
    });
    return { nuevo: Number(res.snapshot.val()) || 0 };
}

function accionSusto(clave) {
    if (bloquearSiMuerto()) return;
    const cfg = SUSTOS[clave];
    if (sustosVistos[clave]) {                       // ya lo vio en esta visita → pop-up
        openModal(cfg.titulo, `<p>${cfg.textoYaVisto}</p>${btnCerrar()}`);
        return;
    }
    const capa  = document.getElementById('sustoOverlay');
    const video = document.getElementById('sustoVideo');

    document.body.classList.add('susto-activo');
    capa.style.display = 'block';
    video.src = cfg.video;

    let terminado = false;
    const fin = () => {                              // se ejecuta UNA vez cuando acaba (o falla) el vídeo
        if (terminado) return;
        terminado = true;
        video.onended = null; video.onerror = null;
        capa.style.display = 'none';
        document.body.classList.remove('susto-activo');
        video.removeAttribute('src'); video.load();
        resolverSusto(clave);
    };
    video.onended = fin;
    video.onerror = fin;                             // si el archivo no existe, no se queda atascado
    video.play().catch(e => { console.log("Video error:", e); fin(); });
}

function resolverSusto(clave) {
    const cfg = SUSTOS[clave];
    sustosVistos[clave] = true;
    if (cfg.audioTras) { const a = new Audio(cfg.audioTras); a.loop = !!cfg.loopAudioTras; a.play().catch(e => {}); }
    openModal(cfg.tituloTras || "¡ADVERTENCIA!", `<p style="color:var(--verdin)">Actualizando cordura...</p>`);

    restarEstadistica('cordura', cfg.cordura)
        .then(res => {
            let locura = "";
            if (res.nuevo <= 0) {                    // cordura a 0
                locura = "<br><br><span style='color:#ff3b30;font-weight:bold;font-size:1.2rem;'>Estás loco de atar</span>";
            }
            openModal(cfg.tituloTras || "¡ADVERTENCIA!", `<p>${cfg.textoTras} ${cfg.cordura} de cordura.${locura}</p>${btnCerrar('Continuar')}`);
        })
        .catch(err => {
            console.error("Error al descontar cordura:", err);
            openModal("Error", `<p style="color:var(--sangre)">Error de conexión al actualizar la cordura.</p>${btnCerrar('Continuar')}`);
        });
}

actualizarIdentidadJugador();
